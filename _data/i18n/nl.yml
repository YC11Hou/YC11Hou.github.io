home:
  eyebrow: 01 — Over mij
  tagline: Onderzoeker in embodied AI; ik werk aan vision-language-action-modellen, luchtnavigatie en reinforcement learning voor <em>echte robots</em>.
  quote: "„Het donkerste uur is vlak voor de dageraad.”"
  bio1: Ik ben masterstudent Elektrotechniek aan de National University of Singapore (NUS) en kernlid van het <strong>NUS CORE Lab</strong> (COntrol, Robotics &amp; Artificial IntElligence). Mijn onderzoek richt zich op <strong>embodied AI</strong> en autonome besluitvorming van robots. Twee van mijn papers, als eerste auteur en als coauteur — <strong>LangGap</strong> en <strong>AION</strong> — zijn geaccepteerd voor <strong>IROS 2026</strong>.
  bio2: "In de zomer van 2026 (1 juni – 31 augustus) was ik <strong>VLA-algoritme-engineer (stagiair)</strong> bij <strong>Honor</strong>, waar ik werkte aan de eigen humanoïde robot <strong>Omega</strong>: verzamelen van teleoperatiedata, replay, training en uitrol op de robot, plus onderzoek naar <strong>online RL</strong> voor VLA-modellen op maatwerk-manipulatietaken — een complete <strong>online SFT / online RL</strong>-pipeline met de mens in de lus (soepele overname door de teleoperator, een interventiedata-pipeline en een gedistribueerde Actor–Learner-architectuur over de AGX/NX-boards van de robot, een x86-host en een ontwikkelserver), aangevuld met RECAP-achtige offline RL met snelle aanpassing in de ruisruimte voor taken die de offline training niet dekt. Breder werk ik aan het benchmarken van <strong>Vision-Language-Action (VLA)</strong>-modellen op taalbegrip, <strong>Vision-Language Navigation (VLN)</strong> voor vliegende robots en <strong>end-to-end reinforcement learning</strong> in complexe 3D-omgevingen. Ik heb ook ervaring met robotica-ontwikkeling in <strong>ROS2</strong>, SLAM en uitrol in de echte wereld."
  bio3: Vóór NUS behaalde ik mijn bachelor Elektronica- en Communicatietechniek aan de Nanjing University of Aeronautics and Astronautics (NUAA).
  news: 02 — Nieuws
  papers: 03 — Geselecteerde publicaties
  work: 04 — Geselecteerd werk
  contact: 05 — Contact
  contact_line: Ik zoek onderzoeksfuncties bij industriële labs die werken aan embodied AI en robotleren, en sta evenzeer open voor promotieplaatsen en academische samenwerking. Bereik me via

