xp:
  intern:
    - position: VLA-algoritme-engineer (stagiair)
      location: Shanghai, China
      h:
        - "Eigenaar van een human-in-the-loop-leerstack voor echte robots met VLA-modellen op Honors zelfontwikkelde humanoïde Omega, end-to-end in zes onderdelen:"
        - "<strong>End-to-end VLA-pipeline:</strong> de verzamelen → post-trainen → uitrollen-cyclus van het lab van nul opgezet (twee teleoperatiesystemen, operatortraining, GR00T N1.7-post-training, realtime inferentie in chunks)."
        - "<strong>Ontwerp van offline data:</strong> vier demonstratiecategorieën (standaard, pak- / plaatsverstoring, foutherstel) zodat de policy bewegende doelen weer volgt en herstelt van gemiste grepen."
        - "<strong>Infrastructuur voor training met menselijke overname:</strong> soepele overname door de teleoperator, een interventiegedreven datapipeline en een gedistribueerde Actor–Learner–Robot-lus (AGX/NX, x86-Actor, GPU-Learner); een taak met gespiegelde opstelling steeg van ≈0% → 50% autonoom succes in ~140 episodes."
        - "<strong>RL-algoritmen voor echte robots:</strong> RECAP (π0.6) met advantage-conditionering overgezet naar GR00T; RAPID ontworpen, een DSRL-achtige adaptatie in de ruisruimte die menselijke correcties hergebruikt voordat een nieuw checkpoint beschikbaar is; de stack uitgebreid naar loco-manipulatie."
        - "<strong>ROVE-reproductie:</strong> XPENGs ROVE gereproduceerd op fijnmotorisch grijpen van telefoons — fasebewuste returns plus een optimistische (expectile) waardefunctie die negatieve advantage vastzet op acties die een overname veroorzaken; autonoom succes 40% → 52%."
        - "<strong>Debuggen op echte robots:</strong> zes bugs op systeemniveau (kleurruimte-mismatch, classifier-hysterese, yaw-drift, verouderde camerabeelden) opgespoord met kwantitatieve metingen."
        - "Resultaat: een eigen lus waarin de robot nieuwe taken leert van menselijke overnames — van data en systemen tot RL-algoritmen en uitrol."
    - position: Onderzoeksstagiair
      location: Singapore
      h:
        - Ontwikkeling van deep-learning-backendmodellen voor signaalverwerking van korteafstandsradar.
        - Onderzoek naar afgeleide taken zoals menselijke houdingsschatting en binnenkaartopbouw/SLAM uit radardata.
    - position: Stagiair robotica-software
      location: Singapore
      h:
        - Validatie op locatie en fabrieksuitrol van autonome navigatie voor heftruckrobots in echte magazijnen (ROS2).
  edu:
    - degree: Master of Science
      area: Elektrotechniek
      location: Singapore
      h:
        - Kernlid van het NUS CORE Lab (COntrol, Robotics &amp; Artificial IntElligence), gericht op embodied AI en autonome besluitvorming van robots.
        - Onderzoek naar waarneming en planning voor vliegende robots met Vision-Language Navigation (VLN) en end-to-end reinforcement learning in complexe 3D-omgevingen.
    - degree: Bachelor of Engineering
      area: Elektronica- en Communicatietechniek
