proj:
  honor:
    meta: 1 jun – 31 aug 2026 · Honor Device Co., Ltd. · Zomerstage
    desc: Stagiair VLA-algoritme-engineer bij Honor (1 juni – 31 augustus 2026). Bouwde een online SFT / online RL-pipeline met de mens in de lus voor Honors humanoïde robot Omega — soepele overname door de teleoperator, een interventiegedreven datapipeline en een gedistribueerde Actor–Learner–Robot-leerlus.
  langgap:
    meta: Okt 2025 – jun 2026 · IROS 2026 · Eerste auteur
    desc: Geaccepteerd voor IROS 2026. Ontwierp een systematisch evaluatiekader met semantische verstoringen dat aantoont dat toonaangevende VLA-modellen taalinstructies negeren ondanks hoge benchmarkscores. Stelde multi-task training in dezelfde scène voor en bouwde een uitgebreide dataset voor fine-tuning.
  aion:
    meta: Jun 2025 – jun 2026 · IROS 2026 · Coauteur
    desc: Geaccepteerd voor IROS 2026. End-to-end RL-raamwerk met twee beleidsfuncties voor visie-gebaseerde ObjectNav in de lucht, zonder externe lokalisatie of globale kaarten. Geëvalueerd op AI2-THOR en IsaacSim.
  vln:
    meta: Jun 2025 – feb 2026 · Habitat · Datapipeline voor VLN in de lucht
    desc: Bouwde een robuuste pipeline om uiteenlopende 3D-paden te genereren in de Habitat-simulator. Overwon de beperkingen van een simulator die voor grondrobots was ontworpen met een robuust 3D-navigatie-algoritme en obstakeldetectie. Trainde een sterk, algemeen navigatiebeleid voor drones.
  vehicle:
    meta: Sep 2024 – apr 2025 · ROS 2 · Jetson Orin NX · Teamleider
    desc: Leidde een team bij de ontwikkeling van een autonoom verkenningssysteem met ROS2 en LiDAR. Implementeerde SLAM-algoritmen (Cartographer, Navigation2) voor realtime kaartopbouw en padplanning. Integreerde YOLOv11 voor objectdetectie en zette het complete systeem uit op embedded hardware.

news:
  announcement_6: "🎉 Twee papers geaccepteerd voor <strong>IROS 2026</strong>: <a href=\"https://arxiv.org/abs/2603.00592\">LangGap</a> (eerste auteur) en <a href=\"https://arxiv.org/abs/2601.15614\">AION</a> (coauteur). Tot in Pittsburgh!"
  announcement_5: Gestart bij Honor als VLA-algoritme-engineer (stagiair) aan de humanoïde robot Omega — teleoperatiedata, training en uitrol.
  announcement_4: Onderzoeksstage bij het Huawei Norbert Wiener Research Center afgerond (maart – mei 2026), deep learning voor korteafstandsradar.
  announcement_3: Stage robotica-software bij Movel.AI afgerond (dec 2025 – jan 2026), autonome navigatie van heftrucks.
  announcement_2: Toegetreden tot het NUS CORE Lab en gestart met de master aan NUS.

xp:
  intern:
    - position: VLA-algoritme-engineer (stagiair)
      location: Shanghai, China
      h:
        - "Werk aan Honors humanoïde robot Omega: verzamelen van teleoperatiedata, replay, training en uitrol op de robot."
        - Onderzoek naar online RL-algoritmen voor Vision-Language-Action (VLA)-modellen op maatwerk-manipulatietaken.
        - Implementatie van soepele overname door de menselijke teleoperator tijdens autonome uitvoering, inclusief de toestandsmachine voor de overgang autonomie–teleoperatie.
        - "Bouw van de interventiegedreven datapipeline voor online leren: opname aan boord, volledige lokale persistentie en automatische upload naar de ontwikkelserver."
        - "Sluiten van de lus over een gedistribueerde leerarchitectuur: AGX/NX-boards aan boord (topics publiceren, commando's uitvoeren, data verzamelen), een x86-host als Actor (inferentie, acties streamen naar de robot) en een ontwikkelserver als Learner (data-aggregatie, training, checkpoint-distributie) — een complete online SFT / online RL-pipeline."
        - "Onderzoek naar RECAP-achtige (π0.6) offline RL gecombineerd met snelle aanpassing in de ruisruimte (DSRL-achtig): corrigerende ruis leren uit menselijke interventies om overnamegedrag snel na te bootsen voordat een nieuw checkpoint klaar is met trainen, met aanzienlijk hogere slagingspercentages op niet-gedekte taken, en uitbreiding naar loco-manipulatie."
    - position: Onderzoeksstagiair
      location: Singapore
      h:
        - Ontwikkeling van deep-learning-backendmodellen voor signaalverwerking van korteafstandsradar.
        - Onderzoek naar afgeleide taken zoals menselijke houdingsschatting en binnenkaartopbouw/SLAM uit radardata.
    - position: Stagiair robotica-software
      location: Singapore
      h:
        - Validatie op locatie en fabrieksuitrol van autonome navigatie voor heftruckrobots in echte magazijnen (ROS2).
