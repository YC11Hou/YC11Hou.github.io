home:
  eyebrow: 01 — Over mij
  tagline: "Onderzoeker in embodied AI: vision-language-action-modellen, reinforcement learning en post-training voor <em>echte robots</em>."
  quote: "“The darkest hour is just before the dawn.”"
  bio1: "Ik ben masterstudent Elektrotechniek aan de National University of Singapore (NUS) en kernlid van het <strong>NUS CORE Lab</strong> (COntrol, Robotics &amp; Artificial IntElligence). Ik werk aan <strong>embodied AI</strong>: hoe robots waarnemen, taal begrijpen en handelen in de fysieke wereld. Wat mij het meest bezighoudt is de hele lus — niet alleen het algoritme, maar de data, de infrastructuur en de uitrol die het omzetten in gedrag op een echte robot."
  bio2: "In de zomer van 2026 (1 juni – 31 augustus) was ik <strong>VLA-algoritme-engineer (stagiair)</strong> in het team van de humanoïde robot van <strong>Honor</strong> in Shanghai, waar ik meebouwde aan deze richting vanaf nul en verschillende kernonderdelen voor mijn rekening nam. Ik leidde de teleoperatie- en datapipeline — soepele menselijke overname tijdens autonome uitvoering, opname aan boord met automatische upload — en sloot een gedistribueerde <strong>real-robot SFT / RL</strong>-lus over de boordcomputers van de robot, een x86-actor en een learner-server. Met die infrastructuur op zijn plaats ontwierp ik zelf de experimenten: <strong>RECAP</strong>-achtige offline RL nagebouwd en gecombineerd met snelle aanpassing in de ruisruimte, wat het slagingspercentage op taken die de offline data nooit dekten aanzienlijk verhoogde."
  bio3: "Mijn onderzoek leverde binnen een jaar twee papers op <strong>IROS 2026</strong> op. Als eerste auteur van <strong>LangGap</strong> liet ik zien dat toonaangevende VLA-modellen hoog scoren terwijl ze taal grotendeels negeren, en stelde ik een benchmark met semantische verstoringen plus multi-task training in dezelfde scène voor om die kloof te dichten; in <strong>AION</strong> ontwierp en trainde ik het puur visuele verkenningsbeleid voor zero-shot objectnavigatie in de lucht. Vóór NUS studeerde ik Elektronica- en Communicatietechniek aan de Nanjing University of Aeronautics and Astronautics (NUAA)."
  news: 02 — Nieuws
  papers: 03 — Geselecteerde publicaties
  work: 04 — Geselecteerd werk
