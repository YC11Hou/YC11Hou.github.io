home:
  eyebrow: 01 — Chi sono
  tagline: "Ricercatore in IA incarnata: modelli visione-linguaggio-azione, navigazione aerea e apprendimento per rinforzo per <em>robot reali</em>."
  quote: "«L'ora più buia è quella che precede l'alba.»"
  bio1: Sono studente magistrale in Ingegneria Elettrica alla National University of Singapore (NUS) e membro principale del <strong>NUS CORE Lab</strong> (COntrol, Robotics &amp; Artificial IntElligence). La mia ricerca riguarda l'<strong>IA incarnata</strong> e il processo decisionale autonomo dei robot. Due miei articoli, come primo autore e coautore — <strong>LangGap</strong> e <strong>AION</strong> — sono stati accettati a <strong>IROS 2026</strong>.
  bio2: "Nell'estate 2026 (1 giugno – 31 agosto) sono stato <strong>ingegnere di algoritmi VLA (stagista)</strong> presso <strong>Honor</strong>, lavorando sul robot umanoide proprietario <strong>Omega</strong>: raccolta dati di teleoperazione, replay, addestramento e deployment sul robot, oltre a ricerca sull'<strong>RL online</strong> per modelli VLA su task di manipolazione personalizzati — una pipeline completa <strong>online SFT / online RL</strong> con l'umano nel ciclo (presa di controllo fluida da parte del teleoperatore, pipeline dei dati di intervento e un'architettura Actor–Learner distribuita tra le schede AGX/NX di bordo, un host x86 e un server di sviluppo), più RL offline in stile RECAP con adattamento rapido nello spazio del rumore per i task non coperti dall'addestramento offline. Più in generale mi occupo di benchmark dei modelli <strong>Vision-Language-Action (VLA)</strong> per la comprensione del linguaggio, di <strong>navigazione visione-linguaggio (VLN)</strong> per robot aerei e di <strong>apprendimento per rinforzo end-to-end</strong> in ambienti 3D complessi. Ho inoltre esperienza nello sviluppo robotico con <strong>ROS2</strong>, SLAM e deployment nel mondo reale."
  bio3: Prima della NUS ho conseguito la laurea in Ingegneria Elettronica e delle Comunicazioni alla Nanjing University of Aeronautics and Astronautics (NUAA).
  news: 02 — Novità
  papers: 03 — Pubblicazioni selezionate
  work: 04 — Lavori selezionati
  contact: 05 — Contatti
  contact_line: Cerco posizioni di ricerca in laboratori industriali che lavorano su IA incarnata e apprendimento robotico, e sono altrettanto aperto a opportunità di dottorato e collaborazioni accademiche. Scrivimi a

