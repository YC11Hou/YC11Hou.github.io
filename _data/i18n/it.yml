proj:
  honor:
    meta: 1 giu – 31 ago 2026 · Honor Device Co., Ltd. · Stage estivo
    desc: Stagista ingegnere di algoritmi VLA presso Honor (1 giugno – 31 agosto 2026). Realizzazione di una pipeline online SFT / online RL con l'umano nel ciclo per il robot umanoide Omega di Honor — presa di controllo fluida del teleoperatore, pipeline dei dati guidata dagli interventi e ciclo di apprendimento distribuito Actor–Learner–Robot.
  langgap:
    meta: Ott 2025 – giu 2026 · IROS 2026 · Primo autore
    desc: Accettato a IROS 2026. Progettazione di un framework sistematico di valutazione con perturbazioni semantiche che rivela come i modelli VLA all'avanguardia ignorino le istruzioni linguistiche nonostante punteggi elevati. Proposta di addestramento multi-task nella stessa scena e costruzione di un dataset aumentato per il fine-tuning.
  aion:
    meta: Giu 2025 – giu 2026 · IROS 2026 · Coautore
    desc: Accettato a IROS 2026. Framework RL end-to-end a doppia politica per ObjectNav aereo basato sulla visione, senza localizzazione esterna né mappe globali. Valutato su AI2-THOR e IsaacSim.
  vln:
    meta: Giu 2025 – feb 2026 · Habitat · Pipeline dati VLN aereo
    desc: Realizzazione di una pipeline robusta per generare traiettorie 3D varie nel simulatore Habitat. Superamento dei limiti di un simulatore pensato per robot terrestri tramite un algoritmo di navigazione 3D robusto e un metodo di rilevamento ostacoli. Addestramento di una politica di navigazione per droni solida e generale.
  vehicle:
    meta: Set 2024 – apr 2025 · ROS 2 · Jetson Orin NX · Team leader
    desc: Guida di un team nello sviluppo di un sistema di esplorazione autonoma con ROS2 e LiDAR. Implementazione di algoritmi SLAM (Cartographer, Navigation2) per mappatura e pianificazione in tempo reale. Integrazione di YOLOv11 per il rilevamento di oggetti e deployment del sistema completo su hardware embedded.

news:
  announcement_6: "🎉 Due articoli accettati a <strong>IROS 2026</strong>: <a href=\"https://arxiv.org/abs/2603.00592\">LangGap</a> (primo autore) e <a href=\"https://arxiv.org/abs/2601.15614\">AION</a> (coautore). Ci vediamo a Pittsburgh!"
  announcement_5: Ingresso in Honor come ingegnere di algoritmi VLA (stagista) sul robot umanoide Omega — dati di teleoperazione, addestramento e deployment.
  announcement_4: Concluso lo stage di ricerca presso lo Huawei Norbert Wiener Research Center (marzo – maggio 2026), su deep learning per radar a corto raggio.
  announcement_3: Concluso lo stage in software robotico presso Movel.AI (dic 2025 – gen 2026), sulla navigazione autonoma di carrelli elevatori.
  announcement_2: Ingresso nel NUS CORE Lab e inizio della laurea magistrale alla NUS.

xp:
  intern:
    - position: Ingegnere di algoritmi VLA (stagista)
      location: Shanghai, Cina
      h:
        - "Lavoro sul robot umanoide Omega di Honor: raccolta dati di teleoperazione, replay, addestramento e deployment sul robot."
        - Ricerca su algoritmi di RL online per modelli Vision-Language-Action (VLA) su task di manipolazione personalizzati.
        - Implementazione della presa di controllo fluida da parte del teleoperatore umano durante l'esecuzione autonoma, inclusa la macchina a stati di transizione autonomia–teleoperazione.
        - "Realizzazione della pipeline dati per l'apprendimento online guidata dagli interventi: registrazione a bordo, persistenza completa su disco locale e caricamento automatico sul server di sviluppo."
        - "Chiusura del ciclo su un'architettura di apprendimento distribuita: schede AGX/NX di bordo (pubblicazione topic, esecuzione comandi, raccolta dati), un host x86 come Actor (inferenza, streaming delle azioni al robot) e un server di sviluppo come Learner (aggregazione dati, addestramento, distribuzione dei checkpoint) — una pipeline online SFT / online RL completa."
        - "Ricerca su RL offline in stile RECAP (π0.6) combinato con adattamento rapido nello spazio del rumore (tipo DSRL): apprendere un rumore correttivo dai dati di intervento umano per imitare rapidamente i comportamenti di presa di controllo prima che un nuovo checkpoint finisca l'addestramento, aumentando sensibilmente il tasso di successo sui task non coperti, con estensione alla loco-manipolazione."
    - position: Stagista di ricerca
      location: Singapore
      h:
        - Sviluppo di modelli di deep learning backend per l'elaborazione di segnali radar a corto raggio.
        - Ricerca su task a valle come la stima della posa umana e la mappatura indoor/SLAM da dati radar.
    - position: Stagista software robotico
      location: Singapore
      h:
        - Validazione in loco e deployment in fabbrica della navigazione autonoma per carrelli elevatori robotizzati in magazzini reali (ROS2).
  edu:
