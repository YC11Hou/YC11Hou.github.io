home:
  eyebrow: 01 — Om mig
  tagline: "Forskare inom förkroppsligad AI: vision-språk-handling-modeller, förstärkningsinlärning och efterträning för <em>riktiga robotar</em>."
  quote: "“The darkest hour is just before the dawn.”"
  bio1: "Jag är masterstudent i elektroteknik vid National University of Singapore (NUS) och kärnmedlem i <strong>NUS CORE Lab</strong> (COntrol, Robotics &amp; Artificial IntElligence). Jag arbetar med <strong>förkroppsligad AI</strong>: hur robotar uppfattar, förstår språk och handlar i den fysiska världen. Det jag bryr mig mest om är hela loopen — inte bara algoritmen, utan datan, infrastrukturen och driftsättningen som gör den till beteende på en riktig robot."
  bio2: "Sommaren 2026 (1 juni – 31 augusti) var jag <strong>VLA-algoritmingenjör (praktikant)</strong> i <strong>Honors</strong> team för den humanoida roboten i Shanghai, där jag var med och byggde upp inriktningen från grunden och ansvarade för flera av dess kärndelar. Jag ledde teleoperations- och datapipelinen — sömlöst mänskligt övertagande under autonoma körningar, inspelning på roboten med automatisk uppladdning — och slöt en distribuerad <strong>real-robot SFT / RL</strong>-loop över robotens inbyggda kort, en x86-aktör och en learner-server. Med den infrastrukturen på plats utformade jag experimenten själv: återskapade <strong>RECAP</strong>-liknande offline-RL och kombinerade det med snabb anpassning i brusrummet, vilket avsevärt höjde framgångsgraden på uppgifter som offline-datan aldrig täckte."
  bio3: "Min forskning har gett två artiklar på <strong>IROS 2026</strong> inom ett år. Som förstaförfattare till <strong>LangGap</strong> visade jag att ledande VLA-modeller får höga poäng samtidigt som de i stort sett ignorerar språket, och föreslog ett benchmark med semantiska störningar samt fleruppgiftsträning i samma scen för att sluta gapet; i <strong>AION</strong> utformade och tränade jag den rent visuella utforskningspolicyn för zero-shot objektnavigering i luften. Före NUS läste jag elektronik- och kommunikationsteknik vid Nanjing University of Aeronautics and Astronautics (NUAA)."
