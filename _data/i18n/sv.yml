proj:
  honor:
    meta: Honor Device Co., Ltd. · Sommarpraktik
    desc: Praktikant som VLA-algoritmingenjör på Honor. Byggde en real-robot SFT / RL-pipeline med människan i loopen för Honors humanoida robot — sömlöst övertagande av teleoperatören, en ingripandedriven datapipeline och en distribuerad Actor–Learner–Robot-inlärningsloop.
  langgap:
    meta: Förstaförfattare
    desc: Antagen till IROS 2026. Utformade ett systematiskt utvärderingsramverk med semantiska störningar som visar att ledande VLA-modeller ignorerar språkinstruktioner trots höga benchmarkresultat. Föreslog fleruppgiftsträning i samma scen och byggde ett utökat dataset för finjustering.
  aion:
    meta: Medförfattare
    desc: Antagen till IROS 2026. End-to-end-RL-ramverk med dubbla policyer för visionsbaserad ObjectNav i luften, utan extern lokalisering eller globala kartor. Utvärderat i AI2-THOR och IsaacSim.
  vln:
    meta: Habitat · Datapipeline för VLN i luften
    desc: Byggde en robust pipeline för att generera varierade 3D-banor i Habitat-simulatorn. Övervann begränsningarna hos en simulator byggd för markrobotar med en robust 3D-navigeringsalgoritm och hinderdetektering. Tränade en stark och generell navigeringspolicy för drönare.
  vehicle:
    meta: ROS 2 · Jetson Orin NX · Teamledare
    desc: Ledde ett team som utvecklade ett autonomt utforskningssystem med ROS2 och LiDAR. Implementerade SLAM-algoritmer (Cartographer, Navigation2) för kartläggning och banplanering i realtid. Integrerade YOLOv11 för objektdetektering och driftsatte hela systemet på inbyggd hårdvara.

news:
  announcement_7: "Avslutade min VLA-algoritmpraktik på Honor (humanoida roboten)."
  announcement_6: "🎉 Två artiklar antagna till <strong>IROS 2026</strong>: <a href=\"https://arxiv.org/abs/2603.00592\">LangGap</a> (förstaförfattare) och <a href=\"https://arxiv.org/abs/2601.15614\">AION</a> (medförfattare)."

xp:
  intern:
    - position: VLA-algoritmingenjör (praktikant)
      location: Shanghai, Kina
      h:
        - "Ansvarade för en människa-i-loopen-stack för inlärning på riktiga robotar med VLA-modeller på Honors egenutvecklade humanoid Omega, från början till slut i sex delar:"
        - "<strong>Heltäckande VLA-pipeline:</strong> byggde labbets cykel samla in → eftertränings → driftsätt från grunden (två teleoperationsrigg, operatörsutbildning, eftertränande av GR00T N1.7, realtidsinferens i block)."
        - "<strong>Design av offlinedata:</strong> fyra demonstrationskategorier (standard, störning vid plock / placering, felåterhämtning) så att policyn åter följer rörliga mål och återhämtar sig efter missade grepp."
        - "<strong>Infrastruktur för träning med mänsklig övertagning:</strong> mjuk övertagning av teleoperatören, en interventionsdriven datapipeline och en distribuerad Actor–Learner–Robot-loop (AGX/NX, x86-Actor, GPU-Learner); en uppgift med spegelvänd layout steg från ≈0% → 50% autonom framgång på ~140 episoder."
        - "<strong>RL-algoritmer för riktiga robotar:</strong> portade RECAP (π0.6) med advantage-konditionerad träning till GR00T; utformade RAPID, en DSRL-liknande anpassning i brusrymden som återanvänder mänskliga korrigeringar innan en ny checkpoint finns; utökade stacken till loko-manipulation."
        - "<strong>Reproduktion av ROVE:</strong> reproducerade XPENGs ROVE på finmotoriskt grepp av telefoner — stegmedvetna returns plus en optimistisk (expektil-)värdefunktion som låser negativ advantage på åtgärder som orsakar övertagning; autonom framgång 40% → 52%."
        - "<strong>Felsökning på riktig robot:</strong> spårade sex buggar på systemnivå (färgrymdsmissmatch, klassificerarhysteres, girdrift, inaktuella kamerabilder) med kvantitativa mätningar."
        - "Resultat: en egen loop där roboten lär sig nya uppgifter av mänskliga övertaganden — över data, system, RL-algoritmer och driftsättning."
    - position: Forskningspraktikant
      location: Singapore
      h:
        - Utvecklade backend-modeller för djupinlärning inom signalbehandling av kortdistansradar.
        - Forskade om nedströmsuppgifter som skattning av mänsklig kroppsställning och inomhuskartläggning/SLAM från radardata.
    - position: Praktikant robotmjukvara
      location: Singapore
      h:
        - Validering på plats och fabriksdriftsättning av autonom navigering för gaffeltruckrobotar i verkliga lagermiljöer (ROS2).
  edu:
