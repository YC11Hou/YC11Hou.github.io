home:
  eyebrow: 01 — 关于
  tagline: "具身智能研究者，方向为视觉-语言-动作模型、在线强化学习，以及面向<em>真实机器人</em>的后训练。"
  quote: "“The darkest hour is just before the dawn.”"
  bio1: "我是新加坡国立大学（NUS）电气工程专业硕士研究生，<strong>NUS CORE Lab</strong>（COntrol, Robotics &amp; Artificial IntElligence）核心成员，研究方向是<strong>具身智能</strong>——让机器人在物理世界中感知、理解语言并行动。我最在意的是整条闭环：不只是算法本身，还有把算法变成真机行为所需的数据、基础设施与部署。"
  bio2: "2026 年夏（6 月 1 日 – 8 月 31 日），我在<strong>荣耀</strong>上海 <strong>Omega</strong> 人形机器人团队担任 <strong>VLA 算法工程师（实习）</strong>，深度参与了该方向从 0 到 1 的建设，并承担其中多项核心工作：主导搭建遥操作与数据采集链路——自主执行中顺滑的人工接管、机器人端数据落盘与自动上传——并打通了跨机载板卡、x86 Actor 与 Learner 服务器的分布式 <strong>online SFT / online RL</strong> 闭环。基础设施成型后，我独立设计实验：复现 <strong>RECAP</strong> 类离线强化学习，并融合噪声空间快速适应，在离线数据未覆盖的任务上大幅提升成功率。"
  bio3: "一年内我产出了两篇 <strong>IROS 2026</strong> 录用论文。作为 <strong>LangGap</strong> 第一作者，我揭示了当前最先进的 VLA 模型高分却大量忽视语言指令的问题，并提出语义扰动评测基准与同场景多任务训练来弥合这一鸿沟；在 <strong>AION</strong> 中，我负责设计与训练纯视觉探索策略，实现无人机零样本室内目标导航。进入 NUS 之前，我在南京航空航天大学（NUAA）攻读电子与通信工程。"
  news: 02 — 动态
