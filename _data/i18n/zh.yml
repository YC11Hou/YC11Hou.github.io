xp:
  intern:
    - position: VLA 算法工程师（实习）
      location: 中国上海
      h:
        - 参与荣耀自研 Omega 人形机器人研发：遥操作数据采集、回放、训练与真机部署。
        - 针对自定义操作任务，开展视觉-语言-动作（VLA）模型的在线强化学习算法研究。
        - 实现自主执行过程中人类遥操作者的平滑接管，包括自主—遥操作切换状态机。
        - 搭建由干预驱动的在线学习数据流水线：机载数据记录、本地磁盘完整持久化，并自动上传至开发服务器。
        - 打通分布式学习架构的闭环：机载 AGX/NX 板卡（话题发布、指令执行、数据采集）、作为 Actor 的 x86 主机（模型推理、向机器人流式下发动作）以及作为 Learner 的开发服务器（数据汇聚、训练、检查点分发）——一条完整的 online SFT / online RL 流水线。
        - 研究 RECAP 式（π0.6）离线 RL 结合噪声空间快速适应（类 DSRL）：从人类干预数据中学习修正噪声，在新检查点训练完成之前快速模仿接管行为，显著提升离线训练未覆盖任务的成功率，并进一步将算法拓展到移动操作任务。
    - position: 科研实习生
      location: 新加坡
      h:
        - 开发面向短距雷达信号处理的后端深度学习模型。
        - 研究基于雷达数据的下游任务，包括人体姿态估计与室内建图/SLAM。
    - position: 机器人软件实习生
      location: 新加坡
      h:
        - 在真实仓储环境中完成叉车机器人自主导航的现场验证与工厂部署（ROS2）。
  edu:
    - degree: 理学硕士
      area: 电气工程
      location: 新加坡
      h:
        - NUS CORE Lab（COntrol, Robotics &amp; Artificial IntElligence）核心成员，研究方向为具身智能与机器人自主决策。
        - 研究基于视觉-语言导航（VLN）的空中机器人感知与规划，以及复杂三维环境中的端到端强化学习。
    - degree: 工学学士
      area: 电子与通信工程
      location: 中国南京
      h:
        - GPA：88/100
        - 主要课程：高等数学（96）、概率论（97）、随机信号分析（97）、微波技术与天线（97）、通信原理（95）、复变函数（99）。
