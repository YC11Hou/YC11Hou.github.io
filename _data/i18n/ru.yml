home:
  eyebrow: 01 — Обо мне
  tagline: "Исследователь в области воплощённого ИИ: модели «зрение–язык–действие», воздушная навигация и обучение с подкреплением для <em>реальных роботов</em>."
  quote: "«Самый тёмный час — перед рассветом.»"
  bio1: Я магистрант по электротехнике в Национальном университете Сингапура (NUS) и ключевой участник <strong>NUS CORE Lab</strong> (COntrol, Robotics &amp; Artificial IntElligence). Мои исследования сосредоточены на <strong>воплощённом ИИ</strong> и автономном принятии решений роботами. Две мои работы — как первого автора и соавтора — <strong>LangGap</strong> и <strong>AION</strong> — приняты на <strong>IROS 2026</strong>.
  bio2: "Летом 2026 года (1 июня – 31 августа) я работал <strong>инженером по алгоритмам VLA (стажёром)</strong> в <strong>Honor</strong> над собственным гуманоидным роботом <strong>Omega</strong>: сбор данных телеуправления, воспроизведение, обучение и развёртывание на роботе, а также исследования <strong>онлайн-RL</strong> для VLA-моделей на собственных задачах манипуляции — полный конвейер <strong>online SFT / online RL</strong> с человеком в контуре (плавный перехват управления телеоператором, конвейер данных вмешательств и распределённая архитектура Actor–Learner на бортовых платах AGX/NX, хосте x86 и сервере разработки), а также офлайн-RL в стиле RECAP с быстрой адаптацией в пространстве шума для задач, не покрытых офлайн-обучением. В более широком плане я занимаюсь бенчмаркингом моделей <strong>«зрение–язык–действие» (VLA)</strong> на понимание языка, <strong>навигацией по зрению и языку (VLN)</strong> для летающих роботов и <strong>сквозным обучением с подкреплением</strong> в сложных 3D-средах. Также имею опыт разработки в робототехнике с <strong>ROS2</strong>, SLAM и развёртыванием в реальных условиях."
  bio3: До NUS я получил степень бакалавра по электронике и связи в Нанкинском университете аэронавтики и астронавтики (NUAA).
