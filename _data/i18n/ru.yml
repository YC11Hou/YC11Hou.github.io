xp:
  intern:
    - position: Инженер по алгоритмам VLA (стажёр)
      location: Шанхай, Китай
      h:
        - "Отвечал за стек обучения на реальных роботах с участием человека в контуре для VLA-моделей на гуманоиде Omega собственной разработки Honor — сквозным образом по шести направлениям:"
        - "<strong>Сквозной конвейер VLA:</strong> с нуля выстроил цикл лаборатории сбор → дообучение → развёртывание (две установки телеуправления, обучение операторов, дообучение GR00T N1.7, инференс в реальном времени по чанкам)."
        - "<strong>Проектирование офлайн-данных:</strong> четыре категории демонстраций (стандартные, возмущения при захвате / размещении, восстановление после сбоев), чтобы политика заново отслеживала движущиеся цели и восстанавливалась после неудачных захватов."
        - "<strong>Инфраструктура обучения с перехватом управления человеком:</strong> плавный перехват оператором, конвейер данных на основе вмешательств и распределённый цикл Actor–Learner–Robot (AGX/NX, Actor на x86, Learner на GPU); задача с зеркальной раскладкой выросла с ≈0% → 50% автономного успеха примерно за 140 эпизодов."
        - "<strong>Алгоритмы RL на реальном роботе:</strong> перенёс на GR00T обучение RECAP (π0.6) с условием по преимуществу; разработал RAPID — адаптацию в пространстве шума в стиле DSRL, которая переиспользует исправления человека до появления нового чекпойнта; расширил стек на локо-манипуляцию."
        - "<strong>Воспроизведение ROVE:</strong> воспроизвёл ROVE от XPENG на задаче точного захвата телефонов — отдачи с учётом стадий и оптимистичная (экспектильная) функция ценности, фиксирующая отрицательное преимущество для действий, вызвавших перехват; автономный успех 40% → 52%."
        - "<strong>Отладка на реальном роботе:</strong> с помощью количественных зондов выявил шесть системных ошибок (несоответствие цветового пространства, гистерезис классификатора, дрейф рыскания, устаревшие кадры камеры)."
        - "Результат: собственный цикл, в котором робот осваивает новые задачи на основе перехватов управления человеком, — охватывающий данные, системы, алгоритмы RL и развёртывание."
    - position: Стажёр-исследователь
      location: Сингапур
      h:
        - Разработка серверных моделей глубокого обучения для обработки сигналов радаров ближнего действия.
        - Исследование прикладных задач, включая оценку позы человека и картирование помещений/SLAM по радарным данным.
    - position: Стажёр по робототехническому ПО
      location: Сингапур
