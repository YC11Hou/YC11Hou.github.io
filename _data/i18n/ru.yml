proj:
  honor:
    meta: Honor Device Co., Ltd. · Летняя стажировка
    desc: Стажёр — инженер по алгоритмам VLA в Honor. Построил конвейер real-robot SFT / RL с человеком в контуре для гуманоидного робота компании Honor — плавный перехват управления телеоператором, конвейер данных на основе вмешательств и распределённый цикл обучения Actor–Learner–Robot.
  langgap:
    meta: Первый автор
    desc: Принято на IROS 2026. Разработал систематическую схему оценки с семантическими возмущениями, показывающую, что передовые VLA-модели игнорируют языковые инструкции несмотря на высокие результаты в бенчмарках. Предложил многозадачное обучение в одной сцене и собрал расширенный набор данных для дообучения.
  aion:
    meta: Соавтор
    desc: Принято на IROS 2026. Сквозная RL-архитектура с двумя политиками для воздушного ObjectNav по зрению без внешней локализации и глобальных карт. Оценена в AI2-THOR и IsaacSim.
  vln:
    meta: Habitat · Конвейер данных VLN для дронов
    desc: Построил надёжный конвейер генерации разнообразных 3D-траекторий в симуляторе Habitat. Преодолел ограничения симулятора, изначально рассчитанного на наземных роботов, с помощью устойчивого алгоритма 3D-навигации и метода обнаружения препятствий. Обучил сильную и общую политику навигации дронов.
  vehicle:
    meta: ROS 2 · Jetson Orin NX · Руководитель команды
    desc: Руководил командой по разработке системы автономного исследования на ROS2 и LiDAR. Реализовал алгоритмы SLAM (Cartographer, Navigation2) для картирования и планирования пути в реальном времени. Интегрировал YOLOv11 для обнаружения объектов и развернул систему целиком на встраиваемом оборудовании.

news:
  announcement_7: "Завершил стажировку по алгоритмам VLA в Honor (гуманоидный робот)."
