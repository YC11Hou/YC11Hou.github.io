home:
  eyebrow: 01 — Обо мне
  tagline: "Исследователь воплощённого ИИ: модели «зрение–язык–действие», обучение с подкреплением и пост-обучение для <em>реальных роботов</em>."
  quote: "“The darkest hour is just before the dawn.”"
  bio1: "Я магистрант по электротехнике в Национальном университете Сингапура (NUS) и ключевой участник <strong>NUS CORE Lab</strong> (COntrol, Robotics &amp; Artificial IntElligence). Занимаюсь <strong>воплощённым ИИ</strong> — тем, как роботы воспринимают мир, понимают язык и действуют в физической среде. Больше всего меня интересует полный цикл: не только алгоритм, но и данные, инфраструктура и развёртывание, которые превращают его в поведение реального робота."
  bio2: "Летом 2026 года (1 июня – 31 августа) я работал <strong>инженером по алгоритмам VLA (стажёром)</strong> в команде гуманоидного робота компании <strong>Honor</strong> в Шанхае, где участвовал в построении направления с нуля и отвечал за несколько его ключевых частей. Я вёл конвейер телеуправления и данных — плавный перехват управления человеком во время автономных запусков, запись на роботе с автоматической загрузкой — и замкнул распределённый цикл <strong>real-robot SFT / RL</strong> между бортовыми платами робота, актором на x86 и сервером-обучателем. На этой инфраструктуре я сам проектировал эксперименты: воспроизвёл офлайн-RL в стиле <strong>RECAP</strong> и объединил его с быстрой адаптацией в пространстве шума, что существенно повысило успешность на задачах, не покрытых офлайн-данными."
  bio3: "За год моя работа дала две статьи на <strong>IROS 2026</strong>. Как первый автор <strong>LangGap</strong> я показал, что передовые VLA-модели набирают высокие баллы, в значительной мере игнорируя язык, и предложил бенчмарк с семантическими возмущениями и многозадачное обучение в одной сцене, чтобы закрыть этот разрыв; в <strong>AION</strong> я спроектировал и обучил чисто визуальную политику исследования для zero-shot воздушной навигации к объектам. До NUS я изучал электронику и связь в Нанкинском университете аэронавтики и астронавтики (NUAA)."
  news: 02 — Новости
  papers: 03 — Избранные публикации
  work: 04 — Избранные работы
  contact: 05 — Контакты
