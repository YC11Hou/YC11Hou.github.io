home:
  eyebrow: 01 — Sobre mí
  tagline: "Investigador en IA encarnada: modelos visión-lenguaje-acción, aprendizaje por refuerzo en línea y post-entrenamiento para <em>robots reales</em>."
  quote: "“The darkest hour is just before the dawn.”"
  bio1: "Soy estudiante de máster en Ingeniería Eléctrica en la National University of Singapore (NUS) y miembro principal del <strong>NUS CORE Lab</strong> (COntrol, Robotics &amp; Artificial IntElligence). Trabajo en <strong>IA encarnada</strong>: cómo los robots perciben, entienden el lenguaje y actúan en el mundo físico. Lo que más me importa es el ciclo completo: no solo el algoritmo, sino los datos, la infraestructura y el despliegue que lo convierten en comportamiento en un robot real."
  bio2: "En el verano de 2026 (1 de junio – 31 de agosto) fui <strong>ingeniero de algoritmos VLA (becario)</strong> en el equipo del robot humanoide de <strong>Honor</strong> en Shanghái, donde participé en construir esta línea desde cero y me hice cargo de varias de sus piezas centrales. Lideré la cadena de teleoperación y datos —toma de control humana fluida durante ejecuciones autónomas, grabación a bordo con subida automática— y cerré un bucle distribuido <strong>online SFT / online RL</strong> entre las placas del robot, un actor x86 y un servidor learner. Con esa infraestructura lista, diseñé yo mismo los experimentos: reproduje RL offline tipo <strong>RECAP</strong> y lo combiné con adaptación rápida en el espacio de ruido, elevando notablemente la tasa de éxito en tareas que los datos offline nunca cubrieron."
  bio3: "Mi investigación ha producido dos artículos en <strong>IROS 2026</strong> en un año. Como primer autor de <strong>LangGap</strong> mostré que los modelos VLA punteros puntúan alto mientras ignoran en gran medida el lenguaje, y propuse un benchmark de perturbaciones semánticas y un entrenamiento multitarea en la misma escena para cerrar esa brecha; en <strong>AION</strong> diseñé y entrené la política de exploración puramente visual para la navegación aérea zero-shot hacia objetos. Antes de la NUS estudié Ingeniería Electrónica y de Comunicaciones en la Nanjing University of Aeronautics and Astronautics (NUAA)."
