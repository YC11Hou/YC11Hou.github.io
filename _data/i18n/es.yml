proj:
  honor:
    meta: 1 jun – 31 ago 2026 · Honor Device Co., Ltd. · Prácticas de verano
    desc: Becario ingeniero de algoritmos VLA en Honor (1 de junio – 31 de agosto de 2026). Construcción de una cadena online SFT / online RL con humano en el bucle para el robot humanoide de Honor — toma de control fluida por el teleoperador, pipeline de datos guiado por intervenciones y un bucle de aprendizaje distribuido Actor–Learner–Robot.
  langgap:
    meta: Oct 2025 – jun 2026 · Primer autor
    desc: Aceptado en IROS 2026. Diseño de un marco sistemático de evaluación con perturbaciones semánticas que revela que los modelos VLA punteros ignoran las instrucciones en lenguaje pese a sus altas puntuaciones. Propuesta de entrenamiento multitarea en la misma escena y construcción de un conjunto de datos aumentado para el ajuste fino.
  aion:
    meta: Jun 2025 – jun 2026 · Coautor
    desc: Aceptado en IROS 2026. Marco RL de extremo a extremo con doble política para ObjectNav aéreo basado en visión, sin localización externa ni mapas globales. Evaluado en AI2-THOR e IsaacSim.
  vln:
    meta: Jun 2025 – feb 2026 · Habitat · Pipeline de datos VLN aéreo
    desc: Construcción de un pipeline robusto para generar trayectorias 3D variadas en el simulador Habitat. Superación de las limitaciones de un simulador diseñado para robots terrestres mediante un algoritmo de navegación 3D robusto y un método de detección de obstáculos. Entrenamiento de una política de navegación de drones sólida y general.
  vehicle:
    meta: Sep 2024 – abr 2025 · ROS 2 · Jetson Orin NX · Líder de equipo
    desc: Liderazgo de un equipo para desarrollar un sistema de exploración autónoma con ROS2 y LiDAR. Implementación de algoritmos SLAM (Cartographer, Navigation2) para mapeo y planificación en tiempo real. Integración de YOLOv11 para detección de objetos y despliegue del sistema completo en hardware embebido.

news:
  announcement_7: "Finalizadas mis prácticas en algoritmos VLA en Honor (robot humanoide)."
  announcement_6: "🎉 Dos artículos aceptados en <strong>IROS 2026</strong>: <a href=\"https://arxiv.org/abs/2603.00592\">LangGap</a> (primer autor) y <a href=\"https://arxiv.org/abs/2601.15614\">AION</a> (coautor)."

xp:
  intern:
    - position: Ingeniero de algoritmos VLA (becario)
      location: Shanghái, China
      h:
        - "Trabajo en el robot humanoide de Honor: captura de datos de teleoperación, reproducción, entrenamiento y despliegue en el robot."
        - Investigación en algoritmos de RL en línea para modelos Visión-Lenguaje-Acción (VLA) en tareas de manipulación a medida.
        - Implementación de una toma de control fluida por el teleoperador humano durante ejecuciones autónomas, incluida la máquina de estados de transición autonomía–teleoperación.
        - "Construcción del pipeline de datos de aprendizaje en línea guiado por intervenciones: grabación a bordo, persistencia completa en disco local y subida automática al servidor de desarrollo."
        - "Cierre del bucle sobre una arquitectura de aprendizaje distribuida: placas AGX/NX a bordo (publicación de tópicos, ejecución de comandos, captura de datos), un host x86 como Actor (inferencia, envío de acciones al robot en streaming) y un servidor de desarrollo como Learner (agregación de datos, entrenamiento, distribución de checkpoints) — una cadena online SFT / online RL completa."
        - "Investigación en RL offline tipo RECAP (π0.6) combinado con adaptación rápida en el espacio de ruido (tipo DSRL): aprender un ruido correctivo a partir de las intervenciones humanas para imitar con rapidez los comportamientos de toma de control antes de que termine de entrenarse un nuevo checkpoint, elevando notablemente la tasa de éxito en tareas no cubiertas, y extensión a loco-manipulación."
    - position: Becario de investigación
      location: Singapur
      h:
        - Desarrollo de modelos de aprendizaje profundo para el procesamiento de señales de radar de corto alcance.
        - Investigación en tareas derivadas como la estimación de pose humana y el mapeo interior/SLAM a partir de datos de radar.
    - position: Becario de software robótico
      location: Singapur
      h:
        - Validación in situ y despliegue en fábrica de la navegación autónoma de carretillas robotizadas en almacenes reales (ROS2).
  edu:
    - degree: Master of Science
      area: Ingeniería Eléctrica
      location: Singapur
      h:
        - Miembro principal del NUS CORE Lab (COntrol, Robotics &amp; Artificial IntElligence), centrado en IA encarnada y toma de decisiones autónoma en robots.
        - Investigación en percepción y planificación para robots aéreos mediante navegación visión-lenguaje (VLN) y aprendizaje por refuerzo de extremo a extremo en entornos 3D complejos.
    - degree: Bachelor of Engineering
      area: Ingeniería Electrónica y de Comunicaciones
      location: Nanjing, China
      h:
        - "Nota media: 88/100"
        - "Asignaturas clave: Matemáticas avanzadas (96), Teoría de la probabilidad (97), Análisis de señales aleatorias (97), Tecnología de microondas y antenas (97), Fundamentos de comunicaciones (95), Variable compleja (99)."
