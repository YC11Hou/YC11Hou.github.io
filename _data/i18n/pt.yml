proj:
  honor:
    meta: 1 jun – 31 ago 2026 · Honor Device Co., Ltd. · Estágio de verão
    desc: Estagiário engenheiro de algoritmos VLA na Honor (1 de junho – 31 de agosto de 2026). Construção de um pipeline online SFT / online RL com o humano no ciclo para o robô humanoide Omega da Honor — tomada de controlo suave pelo teleoperador, pipeline de dados orientado por intervenções e um ciclo de aprendizagem distribuído Actor–Learner–Robô.
  langgap:
    meta: Out 2025 – jun 2026 · IROS 2026 · Primeiro autor
    desc: Aceite na IROS 2026. Conceção de um enquadramento sistemático de avaliação com perturbações semânticas, revelando que os modelos VLA de topo ignoram as instruções em linguagem apesar das pontuações elevadas. Proposta de treino multitarefa na mesma cena e construção de um conjunto de dados aumentado para afinação.
  aion:
    meta: Jun 2025 – jun 2026 · IROS 2026 · Coautor
    desc: Aceite na IROS 2026. Enquadramento RL ponta a ponta de dupla política para ObjectNav aéreo baseado em visão, sem localização externa nem mapas globais. Avaliado em AI2-THOR e IsaacSim.
  vln:
    meta: Jun 2025 – fev 2026 · Habitat · Pipeline de dados VLN aéreo
    desc: Construção de um pipeline robusto para gerar trajetórias 3D variadas no simulador Habitat. Superação das limitações de um simulador concebido para robôs terrestres através de um algoritmo de navegação 3D robusto e de um método de deteção de obstáculos. Treino de uma política de navegação de drones sólida e geral.
  vehicle:
    meta: Set 2024 – abr 2025 · ROS 2 · Jetson Orin NX · Líder de equipa
    desc: Liderança de uma equipa no desenvolvimento de um sistema de exploração autónoma com ROS2 e LiDAR. Implementação de algoritmos SLAM (Cartographer, Navigation2) para mapeamento e planeamento em tempo real. Integração do YOLOv11 para deteção de objetos e implementação do sistema completo em hardware embebido.

news:
  announcement_6: "🎉 Dois artigos aceites na <strong>IROS 2026</strong>: <a href=\"https://arxiv.org/abs/2603.00592\">LangGap</a> (primeiro autor) e <a href=\"https://arxiv.org/abs/2601.15614\">AION</a> (coautor). Até Pittsburgh!"
  announcement_5: Entrada na Honor como engenheiro de algoritmos VLA (estagiário) no robô humanoide Omega — dados de teleoperação, treino e implementação.
  announcement_4: Concluído o estágio de investigação no Huawei Norbert Wiener Research Center (março – maio 2026), em aprendizagem profunda para radar de curto alcance.
  announcement_3: Concluído o estágio em software robótico na Movel.AI (dez 2025 – jan 2026), em navegação autónoma de empilhadores.
  announcement_2: Entrada no NUS CORE Lab e início do mestrado na NUS.

xp:
  intern:
    - position: Engenheiro de algoritmos VLA (estagiário)
      location: Xangai, China
      h:
        - "Trabalho no robô humanoide Omega da Honor: recolha de dados de teleoperação, replay, treino e implementação no robô."
        - Investigação em algoritmos de RL online para modelos Visão-Linguagem-Ação (VLA) em tarefas de manipulação personalizadas.
        - Implementação da tomada de controlo suave pelo teleoperador humano durante execuções autónomas, incluindo a máquina de estados de transição autonomia–teleoperação.
        - "Construção do pipeline de dados de aprendizagem online orientado por intervenções: gravação a bordo, persistência completa em disco local e envio automático para o servidor de desenvolvimento."
        - "Fecho do ciclo numa arquitetura de aprendizagem distribuída: placas AGX/NX a bordo (publicação de tópicos, execução de comandos, recolha de dados), um host x86 como Actor (inferência, envio de ações ao robô em streaming) e um servidor de desenvolvimento como Learner (agregação de dados, treino, distribuição de checkpoints) — um pipeline online SFT / online RL completo."
        - "Investigação em RL offline do tipo RECAP (π0.6) combinado com adaptação rápida no espaço do ruído (tipo DSRL): aprender um ruído corretivo a partir das intervenções humanas para imitar rapidamente os comportamentos de tomada de controlo antes de um novo checkpoint terminar o treino, elevando substancialmente a taxa de sucesso em tarefas não cobertas, com extensão à loco-manipulação."
    - position: Estagiário de investigação
      location: Singapura
      h:
        - Desenvolvimento de modelos de aprendizagem profunda para o processamento de sinais de radar de curto alcance.
        - Investigação em tarefas a jusante como a estimação de pose humana e o mapeamento interior/SLAM a partir de dados de radar.
    - position: Estagiário de software robótico
      location: Singapura
      h:
        - Validação no local e implementação em fábrica da navegação autónoma de empilhadores robotizados em armazéns reais (ROS2).
  edu:
