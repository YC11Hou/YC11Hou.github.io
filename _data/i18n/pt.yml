home:
  eyebrow: 01 — Sobre
  tagline: Investigador em IA incorporada, a trabalhar em modelos visão-linguagem-ação, navegação aérea e aprendizagem por reforço para <em>robôs reais</em>.
  quote: "«A hora mais escura é a que precede o amanhecer.»"
  bio1: Sou estudante de mestrado em Engenharia Elétrica na National University of Singapore (NUS) e membro principal do <strong>NUS CORE Lab</strong> (COntrol, Robotics &amp; Artificial IntElligence). A minha investigação centra-se em <strong>IA incorporada</strong> e na tomada de decisão autónoma de robôs. Dois dos meus artigos, como primeiro autor e coautor — <strong>LangGap</strong> e <strong>AION</strong> — foram aceites na <strong>IROS 2026</strong>.
  bio2: "No verão de 2026 (1 de junho – 31 de agosto) fui <strong>engenheiro de algoritmos VLA (estagiário)</strong> na <strong>Honor</strong>, a trabalhar no robô humanoide próprio <strong>Omega</strong>: recolha de dados de teleoperação, replay, treino e implementação no robô, além de investigação em <strong>RL online</strong> para modelos VLA em tarefas de manipulação personalizadas — um pipeline completo <strong>online SFT / online RL</strong> com o humano no ciclo (tomada de controlo suave pelo teleoperador, pipeline de dados de intervenção e uma arquitetura Actor–Learner distribuída pelas placas AGX/NX do robô, um host x86 e um servidor de desenvolvimento), mais RL offline do tipo RECAP com adaptação rápida no espaço do ruído para tarefas não cobertas pelo treino offline. A minha investigação abrange ainda a avaliação de modelos <strong>Visão-Linguagem-Ação (VLA)</strong> quanto à compreensão da linguagem, <strong>navegação visão-linguagem (VLN)</strong> para robôs aéreos e <strong>aprendizagem por reforço ponta a ponta</strong> em ambientes 3D complexos. Tenho também experiência em desenvolvimento robótico com <strong>ROS2</strong>, SLAM e implementação no mundo real."
  bio3: Antes da NUS, obtive a licenciatura em Engenharia Eletrónica e de Comunicações na Nanjing University of Aeronautics and Astronautics (NUAA).
  news: 02 — Notícias
  papers: 03 — Publicações selecionadas
  work: 04 — Trabalhos selecionados
