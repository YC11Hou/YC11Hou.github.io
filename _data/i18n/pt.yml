proj:
  honor:
    meta: Honor Device Co., Ltd. · Estágio de verão
    desc: Estagiário engenheiro de algoritmos VLA na Honor. Construção de um pipeline real-robot SFT / RL com o humano no ciclo para o robô humanoide da Honor — tomada de controlo suave pelo teleoperador, pipeline de dados orientado por intervenções e um ciclo de aprendizagem distribuído Actor–Learner–Robô.
  langgap:
    meta: Primeiro autor
    desc: Aceite na IROS 2026. Conceção de um enquadramento sistemático de avaliação com perturbações semânticas, revelando que os modelos VLA de topo ignoram as instruções em linguagem apesar das pontuações elevadas. Proposta de treino multitarefa na mesma cena e construção de um conjunto de dados aumentado para afinação.
  aion:
    meta: Coautor
    desc: Aceite na IROS 2026. Enquadramento RL ponta a ponta de dupla política para ObjectNav aéreo baseado em visão, sem localização externa nem mapas globais. Avaliado em AI2-THOR e IsaacSim.
  vln:
    meta: Habitat · Pipeline de dados VLN aéreo
    desc: Construção de um pipeline robusto para gerar trajetórias 3D variadas no simulador Habitat. Superação das limitações de um simulador concebido para robôs terrestres através de um algoritmo de navegação 3D robusto e de um método de deteção de obstáculos. Treino de uma política de navegação de drones sólida e geral.
  vehicle:
    meta: ROS 2 · Jetson Orin NX · Líder de equipa
    desc: Liderança de uma equipa no desenvolvimento de um sistema de exploração autónoma com ROS2 e LiDAR. Implementação de algoritmos SLAM (Cartographer, Navigation2) para mapeamento e planeamento em tempo real. Integração do YOLOv11 para deteção de objetos e implementação do sistema completo em hardware embebido.

news:
  announcement_7: "Concluído o estágio em algoritmos VLA na Honor (robô humanoide)."
  announcement_6: "🎉 Dois artigos aceites na <strong>IROS 2026</strong>: <a href=\"https://arxiv.org/abs/2603.00592\">LangGap</a> (primeiro autor) e <a href=\"https://arxiv.org/abs/2601.15614\">AION</a> (coautor)."

xp:
  intern:
    - position: Engenheiro de algoritmos VLA (estagiário)
      location: Xangai, China
      h:
        - "Responsável por uma pilha de aprendizado robótico real com humano no ciclo para modelos VLA no humanoide Omega, desenvolvido internamente pela Honor, de ponta a ponta em seis frentes:"
        - "<strong>Pipeline VLA de ponta a ponta:</strong> montei do zero o ciclo coletar → pós-treinar → implantar do laboratório (dois equipamentos de teleoperação, treinamento de operadores, pós-treinamento do GR00T N1.7, inferência em tempo real por blocos)."
        - "<strong>Projeto de dados offline:</strong> quatro categorias de demonstrações (padrão, perturbação de pegar / colocar, recuperação de falhas) para que a política volte a rastrear alvos em movimento e se recupere de pegadas falhas."
        - "<strong>Infraestrutura de treinamento com intervenção humana:</strong> assunção suave pelo teleoperador, pipeline de dados guiado por intervenções e ciclo distribuído Actor–Learner–Robot (AGX/NX, Actor x86, Learner GPU); uma tarefa com layout espelhado subiu de ≈0% → 50% de sucesso autônomo em ~140 episódios."
        - "<strong>Algoritmos de RL em robô real:</strong> portei o treinamento condicionado por vantagem do RECAP (π0.6) para o GR00T; projetei o RAPID, uma adaptação no espaço de ruído no estilo DSRL que reaproveita correções humanas antes da chegada de um novo checkpoint; estendi a pilha para loco-manipulação."
        - "<strong>Reprodução do ROVE:</strong> reproduzi o ROVE da XPENG na pegada fina de celulares — retornos sensíveis a etapas mais uma função de valor otimista (expectil) que fixa vantagem negativa nas ações que causam intervenção; sucesso autônomo 40% → 52%."
        - "<strong>Depuração em robô real:</strong> rastreei seis bugs de nível de sistema (incompatibilidade de espaço de cor, histerese do classificador, deriva de guinada, quadros de câmera desatualizados) com sondas quantitativas."
        - "Resultado: um ciclo próprio em que o robô aprende novas tarefas a partir de intervenções humanas, abrangendo dados, sistemas, algoritmos de RL e implantação."
    - position: Estagiário de investigação
      location: Singapura
      h:
        - Desenvolvimento de modelos de aprendizagem profunda para o processamento de sinais de radar de curto alcance.
        - Investigação em tarefas a jusante como a estimação de pose humana e o mapeamento interior/SLAM a partir de dados de radar.
    - position: Estagiário de software robótico
      location: Singapura
      h:
        - Validação no local e implementação em fábrica da navegação autónoma de empilhadores robotizados em armazéns reais (ROS2).
  edu:
    - degree: Master of Science
      area: Engenharia Elétrica
      location: Singapura
      h:
        - Membro principal do NUS CORE Lab (COntrol, Robotics &amp; Artificial IntElligence), com foco em IA incorporada e tomada de decisão autónoma de robôs.
        - Investigação em perceção e planeamento para robôs aéreos com navegação visão-linguagem (VLN) e aprendizagem por reforço ponta a ponta em ambientes 3D complexos.
    - degree: Bachelor of Engineering
      area: Engenharia Eletrónica e de Comunicações
      location: Nanquim, China
      h:
        - "Média: 88/100"
        - "Disciplinas principais: Matemática avançada (96), Teoria das probabilidades (97), Análise de sinais aleatórios (97), Tecnologia de micro-ondas e antenas (97), Fundamentos de comunicações (95), Análise complexa (99)."
