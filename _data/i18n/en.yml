xp:
  intern:
    - position: VLA Algorithm Engineer (Intern)
      location: Shanghai, China
      h:
        - "Owned a human-in-the-loop real-robot learning stack for VLA models on Honor's self-developed Omega humanoid, end to end across six parts:"
        - "<strong>End-to-end VLA pipeline:</strong> set up the lab's collect → post-train → deploy loop from scratch (two teleoperation rigs, operator training, GR00T N1.7 post-training, chunked real-time inference)."
        - "<strong>Offline data design:</strong> four demonstration categories (standard, pick and place perturbations, failure recovery) so the policy re-tracks moving targets and recovers from missed grasps."
        - "<strong>Human-takeover training infra:</strong> smooth teleoperator takeover, an intervention-driven data pipeline and a distributed Actor–Learner–Robot loop (AGX/NX, x86 Actor, GPU Learner); a mirrored-layout task rose from near 0% to 50% autonomous success in about 140 episodes."
        - "<strong>Real-robot RL algorithms:</strong> ported RECAP (π0.6) advantage-conditioned training to GR00T; designed RAPID, a DSRL-style noise-space adaptation that reuses human corrections before a new checkpoint lands; extended the stack to loco-manipulation."
        - "<strong>ROVE reproduction:</strong> reproduced XPENG's ROVE on fine-grained phone grasping — stage-aware returns plus an optimistic (expectile) value function that pins negative advantage on takeover-causing actions; autonomous success from 40% to 52%."
        - "<strong>Real-robot debugging:</strong> traced six system-level bugs (colour-space mismatch, classifier hysteresis, yaw drift, stale camera frames) with quantitative probes."
        - "Result: an in-house loop in which the robot learns new tasks from human takeovers — spanning data, systems, RL algorithms and deployment."
    - position: Research Intern
      location: Singapore
      h:
        - Developed backend deep learning models for short-range radar signal processing.
        - Conducted research on downstream tasks including human pose estimation and indoor mapping/SLAM from radar data.
    - position: Robotics Software Intern
      location: Singapore
      h:
        - On-site validation and factory deployment of autonomous navigation for forklift robots in real warehouse environments (ROS2).
  edu:
    - degree: Master of Science
      area: Electrical Engineering
      location: Singapore
      h:
        - Core member of the NUS CORE Lab (COntrol, Robotics &amp; Artificial IntElligence), focusing on Embodied AI and autonomous robotic decision-making.
        - Research on perception and planning for aerial robots based on Vision-Language Navigation (VLN), and end-to-end Reinforcement Learning in complex 3D environments.
    - degree: Bachelor of Engineering
      area: Electronic and Communication Engineering
      location: Nanjing, China
      h:
        - "GPA: 88/100"
        - "Key Courses: Advanced Mathematics (96), Probability Theory (97), Random Signal Analysis (97), Microwave Technology and Antenna (97), Fundamentals of Communication (95), Complex Function (99)."
