home:
  eyebrow: 01 — About
  tagline: "Embodied AI researcher working on vision-language-action models, reinforcement learning and post-training for <em>real robots</em>."
  quote: "“The darkest hour is just before the dawn.”"
  bio1: "I am a Master's student in Electrical Engineering at the National University of Singapore (NUS) and a core member of the <strong>NUS CORE Lab</strong> (COntrol, Robotics &amp; Artificial IntElligence). I work on <strong>Embodied AI</strong> — how robots perceive, understand language and act in the physical world. What I care about most is the whole loop: not just the algorithm, but the data, the infrastructure and the deployment that turn it into behaviour on a real robot."
  bio2: "In summer 2026 (Jun 1 – Aug 31) I was a <strong>VLA Algorithm Engineer (Intern)</strong> on <strong>Honor</strong>'s humanoid-robot team in Shanghai, where I took part in building the direction from the ground up and owned several of its core pieces. I led the teleoperation and data pipeline — smooth human takeover during autonomous rollouts, on-robot recording with automatic upload — and closed a distributed <strong>real-robot SFT / RL</strong> loop across the robot's onboard boards, an x86 actor and a learner server. With that infrastructure in place I designed the experiments myself: reproducing <strong>RECAP</strong>-style offline RL and combining it with noise-space fast adaptation, which substantially raised success rates on tasks the offline data never covered."
  bio3: "My research has produced two <strong>IROS 2026</strong> papers within a year. As first author of <strong>LangGap</strong> I showed that state-of-the-art VLA models score highly while largely ignoring language, and proposed a semantic-perturbation benchmark plus same-scene multi-task training to close the gap; in <strong>AION</strong> I designed and trained the vision-only exploration policy for zero-shot aerial object navigation. Before NUS I studied Electronic and Communication Engineering at Nanjing University of Aeronautics and Astronautics (NUAA)."
  news: 02 — News
  papers: 03 — Selected publications
  work: 04 — Selected work
  contact: 05 — Contact
  contact_line: I'm looking for research positions in industry labs working on embodied AI and robot learning, and am equally open to PhD opportunities and academic collaborations. Reach me at

