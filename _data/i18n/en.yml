home:
  eyebrow: 01 — About
  tagline: Embodied AI researcher working on vision-language-action models, aerial navigation, and reinforcement learning for <em>real robots</em>.
  quote: "“The darkest hour is just before the dawn.”"
  bio1: I am a Master student in Electrical Engineering at the National University of Singapore (NUS), and a core member of the <strong>NUS CORE Lab</strong> (COntrol, Robotics &amp; Artificial IntElligence). My research focuses on <strong>Embodied AI</strong> and autonomous robotic decision-making. Two of my first-/co-authored papers — <strong>LangGap</strong> and <strong>AION</strong> — are accepted at <strong>IROS 2026</strong>.
  bio2: "In summer 2026 (Jun 1 – Aug 31), I was a <strong>VLA Algorithm Engineer (Intern)</strong> at <strong>Honor</strong>, working on the self-developed <strong>Omega humanoid robot</strong>: teleoperation data collection, replay, training, and on-robot deployment, along with <strong>online RL</strong> algorithm research for VLA models on custom manipulation tasks — a full human-in-the-loop <strong>online SFT / online RL</strong> pipeline (smooth teleoperator takeover, intervention data pipeline, and a distributed Actor–Learner architecture across onboard AGX/NX boards, an x86 host, and a development server), plus RECAP-style offline RL with noise-space fast adaptation for tasks uncovered by offline training. My broader research covers benchmarking <strong>Vision-Language-Action (VLA)</strong> models for language grounding, <strong>Vision-Language Navigation (VLN)</strong> for aerial robots, and <strong>end-to-end Reinforcement Learning</strong> in complex 3D environments. I am also experienced in robotics development with <strong>ROS2</strong>, SLAM, and real-world deployment."
  bio3: Before joining NUS, I obtained my Bachelor's degree in Electronic and Communication Engineering from Nanjing University of Aeronautics and Astronautics (NUAA).
  news: 02 — News
  papers: 03 — Selected publications
  work: 04 — Selected work
  contact: 05 — Contact
  contact_line: I'm looking for research positions in industry labs working on embodied AI and robot learning, and am equally open to PhD opportunities and academic collaborations. Reach me at

