proj:
  honor:
    meta: Jun 1 – Aug 31, 2026 · Honor Device Co., Ltd. · Summer internship
    desc: VLA Algorithm Engineer Intern at Honor (Jun 1 – Aug 31, 2026). Built a human-in-the-loop online SFT / online RL pipeline for Honor's self-developed Omega humanoid robot — smooth teleoperator takeover, an intervention-driven data pipeline, and a distributed Actor–Learner–Robot learning loop.
  langgap:
    meta: Oct 2025 – Jun 2026 · IROS 2026 · First author
    desc: Accepted at IROS 2026. Designed a systematic semantic perturbation evaluation framework revealing that state-of-the-art VLA models ignore language instructions despite high benchmark scores. Proposed multi-task same-scene training approach and constructed augmented dataset for fine-tuning.
  aion:
    meta: Jun 2025 – Jun 2026 · IROS 2026 · Co-author
    desc: Accepted at IROS 2026. End-to-end dual-policy RL framework for vision-based aerial ObjectNav without external localization or global maps. Evaluated on AI2-THOR and IsaacSim.
  vln:
    meta: Jun 2025 – Feb 2026 · Habitat · Aerial VLN dataset pipeline
    desc: Built a robust pipeline to generate various 3D paths in the Habitat simulator. Overcame challenges of the simulator initially designed only for ground robots by designing a robust 3D navigation algorithm and obstacle detection method. Trained a strong and general policy for drone navigation.
  vehicle:
    meta: Sep 2024 – Apr 2025 · ROS 2 · Jetson Orin NX · Team lead
    desc: Led a team to develop an autonomous exploration system using ROS2 and LiDAR. Implemented SLAM algorithms including Cartographer and Navigation2 for real-time mapping and path planning. Integrated YOLOv11 for object detection and deployed the complete system on embedded hardware.

news:
  announcement_6: "🎉 Two papers accepted to <strong>IROS 2026</strong>: <a href=\"https://arxiv.org/abs/2603.00592\">LangGap</a> (first author) and <a href=\"https://arxiv.org/abs/2601.15614\">AION</a> (co-author). See you in Pittsburgh!"
  announcement_5: Joined Honor as a VLA Algorithm Engineer (Intern), working on the Omega humanoid robot — teleoperation data collection, training, and deployment.
  announcement_4: Completed my research internship at Huawei Norbert Wiener Research Center (Mar – May 2026), working on deep learning for short-range radar sensing.
  announcement_3: Completed robotics software internship at Movel.AI (Dec 2025 – Jan 2026), working on autonomous forklift navigation.
  announcement_2: Joined the NUS CORE Lab, started Master's program at NUS.

xp:
  intern:
    - position: VLA Algorithm Engineer (Intern)
      location: Shanghai, China
      h:
        - "Working on Honor's self-developed Omega humanoid robot: teleoperation data collection, replay, training, and on-robot deployment."
        - Conducting online RL algorithm research for Vision-Language-Action (VLA) models on custom manipulation tasks.
        - Implemented smooth human-teleoperator takeover during autonomous rollouts, including the autonomy-teleoperation transition state machine.
        - "Built the intervention-driven online-learning data pipeline: on-robot data recording, full local disk persistence, and automatic upload to the development server."
        - "Closed the loop over a distributed learning architecture: onboard AGX/NX boards (topic publishing, command execution, data collection), an x86 host as the Actor (model inference, streaming actions to the robot), and a development server as the Learner (data aggregation, training, checkpoint dispatch) - a complete online SFT / online RL pipeline."
        - "Researching RECAP-style (pi-0.6) offline RL combined with noise-space fast adaptation (DSRL-like): learning corrective noise from human-intervention data to rapidly imitate takeover behaviors before a new checkpoint finishes training, substantially raising success rates on tasks uncovered by offline training, and further adapting the algorithm to loco-manipulation tasks."
    - position: Research Intern
      location: Singapore
      h:
        - Developed backend deep learning models for short-range radar signal processing.
        - Conducted research on downstream tasks including human pose estimation and indoor mapping/SLAM from radar data.
    - position: Robotics Software Intern
      location: Singapore
      h:
        - On-site validation and factory deployment of autonomous navigation for forklift robots in real warehouse environments (ROS2).
