home:
  eyebrow: 01 — Über mich
  tagline: "Forscher im Bereich Embodied AI: Vision-Language-Action-Modelle, Reinforcement Learning und Post-Training für <em>echte Roboter</em>."
  quote: "“The darkest hour is just before the dawn.”"
  bio1: "Ich bin Masterstudent der Elektrotechnik an der National University of Singapore (NUS) und Kernmitglied des <strong>NUS CORE Lab</strong> (COntrol, Robotics &amp; Artificial IntElligence). Ich arbeite an <strong>Embodied AI</strong> — wie Roboter wahrnehmen, Sprache verstehen und in der physischen Welt handeln. Am wichtigsten ist mir der ganze Kreislauf: nicht nur der Algorithmus, sondern die Daten, die Infrastruktur und der Einsatz, die ihn zu Verhalten auf einem echten Roboter machen."
  bio2: "Im Sommer 2026 (1. Juni – 31. August) war ich <strong>VLA-Algorithmus-Ingenieur (Praktikant)</strong> im Team des humanoiden Roboters von <strong>Honor</strong> in Shanghai, wo ich diese Richtung von Grund auf mit aufgebaut und mehrere zentrale Bausteine verantwortet habe. Ich habe die Teleoperations- und Datenpipeline geleitet — nahtlose menschliche Übernahme während autonomer Ausführung, Aufzeichnung auf dem Roboter mit automatischem Upload — und einen verteilten <strong>Real-Robot-SFT-/RL</strong>-Kreislauf über die Bordrechner des Roboters, einen x86-Actor und einen Learner-Server geschlossen. Auf dieser Infrastruktur habe ich die Experimente selbst entworfen: <strong>RECAP</strong>-artiges Offline-RL reproduziert und mit schneller Anpassung im Rauschraum kombiniert, was die Erfolgsrate auf Aufgaben, die die Offline-Daten nie abdeckten, deutlich erhöht hat."
  bio3: "Meine Forschung hat innerhalb eines Jahres zwei Arbeiten auf der <strong>IROS 2026</strong> hervorgebracht. Als Erstautor von <strong>LangGap</strong> habe ich gezeigt, dass aktuelle VLA-Modelle hohe Werte erzielen und Sprache dabei weitgehend ignorieren, und einen Benchmark mit semantischen Störungen plus Multi-Task-Training in identischer Szene vorgeschlagen, um diese Lücke zu schließen; in <strong>AION</strong> habe ich die rein visuelle Explorationsstrategie für Zero-Shot-Objektnavigation in der Luft entworfen und trainiert. Vor der NUS studierte ich Elektronik- und Kommunikationstechnik an der Nanjing University of Aeronautics and Astronautics (NUAA)."
  news: 02 — Neuigkeiten
  papers: 03 — Ausgewählte Publikationen
  work: 04 — Ausgewählte Arbeiten
  contact: 05 — Kontakt
  contact_line: Ich suche Forschungsstellen in Industrielabors, die an Embodied AI und robotischem Lernen arbeiten, und bin ebenso offen für Promotionsstellen und akademische Kooperationen. Erreichen Sie mich unter

