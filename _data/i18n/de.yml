proj:
  honor:
    meta: 1. Juni – 31. Aug. 2026 · Honor Device Co., Ltd. · Sommerpraktikum
    desc: VLA-Algorithmus-Ingenieur (Praktikant) bei Honor (1. Juni – 31. August 2026). Aufbau einer Online-SFT-/Online-RL-Pipeline mit Mensch in der Schleife für den humanoiden Roboter von Honor — nahtlose Teleoperator-Übernahme, interventionsgetriebene Datenpipeline und eine verteilte Actor–Learner–Roboter-Lernschleife.
  langgap:
    meta: Okt. 2025 – Juni 2026 · Erstautor
    desc: Angenommen bei IROS 2026. Entwurf eines systematischen Evaluationsrahmens mit semantischen Störungen, der zeigt, dass aktuelle VLA-Modelle Sprachanweisungen trotz hoher Benchmark-Werte weitgehend ignorieren. Vorschlag eines Multi-Task-Trainings in identischer Szene und Aufbau eines erweiterten Datensatzes zum Fine-Tuning.
  aion:
    meta: Juni 2025 – Juni 2026 · Mitautor
    desc: Angenommen bei IROS 2026. End-to-End-RL-Framework mit zwei Strategien für visionsbasierte ObjectNav in der Luft, ohne externe Lokalisierung oder globale Karten. Evaluiert in AI2-THOR und IsaacSim.
  vln:
    meta: Juni 2025 – Feb. 2026 · Habitat · Datenpipeline für VLN in der Luft
    desc: Aufbau einer robusten Pipeline zur Erzeugung vielfältiger 3D-Pfade im Habitat-Simulator. Die Grenzen des ursprünglich für Bodenroboter ausgelegten Simulators wurden durch einen robusten 3D-Navigationsalgorithmus und eine Hinderniserkennung überwunden. Training einer starken, allgemeinen Navigationsstrategie für Drohnen.
  vehicle:
    meta: Sept. 2024 – Apr. 2025 · ROS 2 · Jetson Orin NX · Teamleitung
    desc: Leitung eines Teams zur Entwicklung eines autonomen Explorationssystems mit ROS2 und LiDAR. Umsetzung von SLAM-Algorithmen (Cartographer, Navigation2) für Echtzeit-Kartierung und Pfadplanung. Integration von YOLOv11 zur Objekterkennung und Einsatz des Gesamtsystems auf eingebetteter Hardware.

news:
  announcement_7: "VLA-Algorithmus-Praktikum bei Honor abgeschlossen (humanoider Roboter)."
  announcement_6: "🎉 Zwei Arbeiten bei der <strong>IROS 2026</strong> angenommen: <a href=\"https://arxiv.org/abs/2603.00592\">LangGap</a> (Erstautor) und <a href=\"https://arxiv.org/abs/2601.15614\">AION</a> (Mitautor)."

xp:
  intern:
    - position: VLA-Algorithmus-Ingenieur (Praktikant)
      location: Shanghai, China
      h:
        - "Arbeit am humanoiden Roboter von Honor: Erfassung von Teleoperationsdaten, Replay, Training und Einsatz auf dem Roboter."
        - Forschung zu Online-RL-Algorithmen für Vision-Language-Action-(VLA)-Modelle auf eigens definierten Manipulationsaufgaben.
        - Umsetzung einer nahtlosen Übernahme durch den menschlichen Teleoperator während autonomer Ausführung, inklusive Zustandsautomat für den Wechsel Autonomie–Teleoperation.
        - "Aufbau der interventionsgetriebenen Datenpipeline für Online-Lernen: Aufzeichnung auf dem Roboter, vollständige lokale Persistenz und automatischer Upload zum Entwicklungsserver."
        - "Schließen der Schleife über eine verteilte Lernarchitektur: AGX/NX-Boards an Bord (Topic-Publishing, Befehlsausführung, Datenerfassung), ein x86-Host als Actor (Inferenz, Streaming der Aktionen zum Roboter) und ein Entwicklungsserver als Learner (Datenaggregation, Training, Checkpoint-Verteilung) — eine vollständige Online-SFT-/Online-RL-Pipeline."
        - "Forschung zu RECAP-artigem (π0.6) Offline-RL kombiniert mit schneller Anpassung im Rauschraum (DSRL-ähnlich): Lernen eines korrigierenden Rauschens aus menschlichen Interventionen, um Übernahmeverhalten schnell zu imitieren, bevor ein neuer Checkpoint fertig trainiert ist — deutlich höhere Erfolgsraten bei nicht abgedeckten Aufgaben, mit Erweiterung auf Loko-Manipulation."
    - position: Forschungspraktikant
      location: Singapur
      h:
        - Entwicklung von Deep-Learning-Backend-Modellen für die Signalverarbeitung von Nahbereichsradar.
        - Forschung zu Downstream-Aufgaben wie Schätzung menschlicher Körperhaltung und Innenraumkartierung/SLAM aus Radardaten.
    - position: Praktikant Robotiksoftware
      location: Singapur
      h:
        - Vor-Ort-Validierung und Werkseinsatz autonomer Navigation für Gabelstapler-Roboter in realen Lagerumgebungen (ROS2).
  edu:
