proj:
  honor:
    meta: Honor Device Co., Ltd. · Sommerpraktikum
    desc: VLA-Algorithmus-Ingenieur (Praktikant) bei Honor. Aufbau einer Real-Robot-SFT-/RL-Pipeline mit Mensch in der Schleife für den humanoiden Roboter von Honor — nahtlose Teleoperator-Übernahme, interventionsgetriebene Datenpipeline und eine verteilte Actor–Learner–Roboter-Lernschleife.
  langgap:
    meta: Erstautor
    desc: Angenommen bei IROS 2026. Entwurf eines systematischen Evaluationsrahmens mit semantischen Störungen, der zeigt, dass aktuelle VLA-Modelle Sprachanweisungen trotz hoher Benchmark-Werte weitgehend ignorieren. Vorschlag eines Multi-Task-Trainings in identischer Szene und Aufbau eines erweiterten Datensatzes zum Fine-Tuning.
  aion:
    meta: Mitautor
    desc: Angenommen bei IROS 2026. End-to-End-RL-Framework mit zwei Strategien für visionsbasierte ObjectNav in der Luft, ohne externe Lokalisierung oder globale Karten. Evaluiert in AI2-THOR und IsaacSim.
  vln:
    meta: Habitat · Datenpipeline für VLN in der Luft
    desc: Aufbau einer robusten Pipeline zur Erzeugung vielfältiger 3D-Pfade im Habitat-Simulator. Die Grenzen des ursprünglich für Bodenroboter ausgelegten Simulators wurden durch einen robusten 3D-Navigationsalgorithmus und eine Hinderniserkennung überwunden. Training einer starken, allgemeinen Navigationsstrategie für Drohnen.
  vehicle:
    meta: ROS 2 · Jetson Orin NX · Teamleitung
    desc: Leitung eines Teams zur Entwicklung eines autonomen Explorationssystems mit ROS2 und LiDAR. Umsetzung von SLAM-Algorithmen (Cartographer, Navigation2) für Echtzeit-Kartierung und Pfadplanung. Integration von YOLOv11 zur Objekterkennung und Einsatz des Gesamtsystems auf eingebetteter Hardware.

news:
  announcement_7: "VLA-Algorithmus-Praktikum bei Honor abgeschlossen (humanoider Roboter)."
  announcement_6: "🎉 Zwei Arbeiten bei der <strong>IROS 2026</strong> angenommen: <a href=\"https://arxiv.org/abs/2603.00592\">LangGap</a> (Erstautor) und <a href=\"https://arxiv.org/abs/2601.15614\">AION</a> (Mitautor)."

xp:
  intern:
    - position: VLA-Algorithmus-Ingenieur (Praktikant)
      location: Shanghai, China
      h:
        - "Verantwortlich für einen Human-in-the-Loop-Lernstack für reale Roboter mit VLA-Modellen auf Honors selbst entwickeltem Humanoiden Omega, durchgängig über sechs Bereiche:"
        - "<strong>Durchgängige VLA-Pipeline:</strong> den Kreislauf Erfassen → Post-Training → Deployment des Labors von Grund auf aufgebaut (zwei Teleoperations-Rigs, Bedienerschulung, GR00T-N1.7-Post-Training, Echtzeit-Inferenz in Chunks)."
        - "<strong>Offline-Datendesign:</strong> vier Demonstrationskategorien (Standard, Pick-/Place-Störung, Fehlerbehebung), damit die Policy bewegte Ziele neu verfolgt und sich von verfehlten Griffen erholt."
        - "<strong>Infrastruktur für Human-Takeover-Training:</strong> nahtlose Übernahme durch den Teleoperator, eine interventionsgesteuerte Datenpipeline und eine verteilte Actor–Learner–Robot-Schleife (AGX/NX, x86-Actor, GPU-Learner); eine Aufgabe mit gespiegeltem Layout stieg in ~140 Episoden von ≈0% → 50% autonomer Erfolgsquote."
        - "<strong>RL-Algorithmen für reale Roboter:</strong> RECAP-(π0.6)-Training mit Advantage-Konditionierung auf GR00T portiert; RAPID entworfen, eine DSRL-artige Adaption im Rauschraum, die menschliche Korrekturen vor Eintreffen eines neuen Checkpoints wiederverwendet; den Stack auf Loco-Manipulation erweitert."
        - "<strong>ROVE-Reproduktion:</strong> XPENGs ROVE beim feinmotorischen Greifen von Smartphones reproduziert — stufenbewusste Returns plus eine optimistische (Expektil-)Wertfunktion, die negativen Advantage auf übernahmeauslösende Aktionen festlegt; autonome Erfolgsquote 40% → 52%."
        - "<strong>Debugging am realen Roboter:</strong> sechs Fehler auf Systemebene (Farbraum-Abweichung, Klassifikator-Hysterese, Gier-Drift, veraltete Kamerabilder) mit quantitativen Sonden zurückverfolgt."
        - "Ergebnis: eine hausinterne Schleife, in der der Roboter neue Aufgaben aus menschlichen Übernahmen lernt — über Daten, Systeme, RL-Algorithmen und Deployment hinweg."
    - position: Forschungspraktikant
      location: Singapur
      h:
        - Entwicklung von Deep-Learning-Backend-Modellen für die Signalverarbeitung von Nahbereichsradar.
        - Forschung zu Downstream-Aufgaben wie Schätzung menschlicher Körperhaltung und Innenraumkartierung/SLAM aus Radardaten.
    - position: Praktikant Robotiksoftware
      location: Singapur
      h:
        - Vor-Ort-Validierung und Werkseinsatz autonomer Navigation für Gabelstapler-Roboter in realen Lagerumgebungen (ROS2).
  edu:
    - degree: Master of Science
      area: Elektrotechnik
      location: Singapur
      h:
        - Kernmitglied des NUS CORE Lab (COntrol, Robotics &amp; Artificial IntElligence) mit Fokus auf Embodied AI und autonomer Entscheidungsfindung von Robotern.
        - Forschung zu Wahrnehmung und Planung für Flugroboter mittels Vision-Language Navigation (VLN) sowie End-to-End-Reinforcement-Learning in komplexen 3D-Umgebungen.
    - degree: Bachelor of Engineering
