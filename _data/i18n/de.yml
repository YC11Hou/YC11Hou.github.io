home:
  eyebrow: 01 — Über mich
  tagline: Forscher im Bereich Embodied AI – Vision-Language-Action-Modelle, Luftnavigation und Reinforcement Learning für <em>echte Roboter</em>.
  quote: "„Die dunkelste Stunde ist die vor der Dämmerung.“"
  bio1: Ich bin Masterstudent der Elektrotechnik an der National University of Singapore (NUS) und Kernmitglied des <strong>NUS CORE Lab</strong> (COntrol, Robotics &amp; Artificial IntElligence). Mein Forschungsschwerpunkt liegt auf <strong>Embodied AI</strong> und autonomer Entscheidungsfindung von Robotern. Zwei meiner Arbeiten als Erst- bzw. Mitautor — <strong>LangGap</strong> und <strong>AION</strong> — wurden bei der <strong>IROS 2026</strong> angenommen.
  bio2: "Im Sommer 2026 (1. Juni – 31. August) war ich <strong>VLA-Algorithmus-Ingenieur (Praktikant)</strong> bei <strong>Honor</strong> und arbeitete am hauseigenen humanoiden Roboter <strong>Omega</strong>: Erfassung von Teleoperationsdaten, Replay, Training und Einsatz auf dem Roboter sowie Forschung zu <strong>Online-RL</strong> für VLA-Modelle auf eigens definierten Manipulationsaufgaben — eine vollständige <strong>Online-SFT-/Online-RL</strong>-Pipeline mit Mensch in der Schleife (nahtlose Übernahme durch den Teleoperator, Datenpipeline für Interventionen und eine verteilte Actor–Learner-Architektur über die AGX/NX-Boards des Roboters, einen x86-Host und einen Entwicklungsserver), ergänzt um RECAP-artiges Offline-RL mit schneller Anpassung im Rauschraum für Aufgaben, die das Offline-Training nicht abdeckt. Darüber hinaus befasse ich mich mit dem Benchmarking von <strong>Vision-Language-Action-(VLA)</strong>-Modellen hinsichtlich Sprachverständnis, <strong>Vision-Language Navigation (VLN)</strong> für Flugroboter und <strong>End-to-End-Reinforcement-Learning</strong> in komplexen 3D-Umgebungen. Ich habe außerdem Erfahrung in der Robotikentwicklung mit <strong>ROS2</strong>, SLAM und dem Einsatz auf realen Systemen."
  bio3: Vor der NUS erwarb ich meinen Bachelor in Elektronik- und Kommunikationstechnik an der Nanjing University of Aeronautics and Astronautics (NUAA).
  news: 02 — Neuigkeiten
  papers: 03 — Ausgewählte Publikationen
  work: 04 — Ausgewählte Arbeiten
  contact: 05 — Kontakt
  contact_line: Ich suche Forschungsstellen in Industrielabors, die an Embodied AI und robotischem Lernen arbeiten, und bin ebenso offen für Promotionsstellen und akademische Kooperationen. Erreichen Sie mich unter

