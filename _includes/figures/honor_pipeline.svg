<text x="457.0" y="81.2" class="t" text-anchor="middle">post-training</text>
<text x="457.0" y="95.6" class="m" text-anchor="middle">VLM frozen</text>
<path d="M515.0,76.0 L533.0,76.0" class="ln" marker-end="url(#honor_pipeline-ah)"/>
<rect x="536.0" y="34.0" width="110.0" height="84.0" rx="5" class="box"/>
