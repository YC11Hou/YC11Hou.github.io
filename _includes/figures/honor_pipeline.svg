<text x="591.0" y="95.6" class="m" text-anchor="middle">ckpt / 2K steps</text>
<path d="M649.0,76.0 L667.0,76.0" class="ln" marker-end="url(#honor_pipeline-ah)"/>
<rect x="670.0" y="34.0" width="110.0" height="84.0" rx="5" class="box k-acc"/>
<text x="725.0" y="65.2" class="t" text-anchor="middle">On-robot</text>
<text x="725.0" y="81.2" class="t" text-anchor="middle">inference</text>
