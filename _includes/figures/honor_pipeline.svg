<text x="189.0" y="65.2" class="t" text-anchor="middle">LeRobot</text>
<text x="189.0" y="81.2" class="t" text-anchor="middle">conversion</text>
<text x="189.0" y="95.6" class="m" text-anchor="middle">v2.1 format</text>
<path d="M247.0,76.0 L265.0,76.0" class="ln" marker-end="url(#honor_pipeline-ah)"/>
<rect x="268.0" y="34.0" width="110.0" height="84.0" rx="5" class="box"/>
<text x="323.0" y="65.2" class="t" text-anchor="middle">Mixing &amp;</text>
<text x="323.0" y="81.2" class="t" text-anchor="middle">screening</text>
