<text x="0.0" y="206.0" class="cap">DATA</text>
<text x="0.0" y="226.0" class="t">848 episodes · 306K frames</text>
<text x="0.0" y="244.0" class="m">screened from 1,067</text>
<text x="209.0" y="206.0" class="cap">ACTION SPACE</text>
<text x="209.0" y="226.0" class="t">37-D · 30-step chunks</text>
<text x="209.0" y="244.0" class="m">root 4 + joints 29</text>
<text x="209.0" y="258.0" class="m">+ head 2 + hands 2</text>
<line x1="195.0" y1="194.0" x2="195.0" y2="262.0" class="grid"/>
<text x="404.0" y="206.0" class="cap">TRAINABLE</text>
<text x="404.0" y="226.0" class="t">projector + action head</text>
<text x="404.0" y="244.0" class="m">3B backbone frozen</text>
<text x="404.0" y="258.0" class="m">4-step diffusion ≈ 0.23 s</text>
<line x1="390.0" y1="194.0" x2="390.0" y2="262.0" class="grid"/>
<text x="599.0" y="206.0" class="cap">COMPUTE</text>
<text x="599.0" y="226.0" class="t">2 × 8 GPUs · batch 256</text>
<text x="599.0" y="244.0" class="m">20K steps ≈ 95 epochs</text>
<text x="599.0" y="258.0" class="m">lr 1e-4</text>
<line x1="585.0" y1="194.0" x2="585.0" y2="262.0" class="grid"/>
