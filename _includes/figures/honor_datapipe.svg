<svg class="fig-svg" viewBox="0 0 780 250" role="img" aria-label="Intervention-driven data pipeline and the composition of one round of real-robot data" xmlns="http://www.w3.org/2000/svg">
<defs><marker id="honor_datapipe-ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z" class="ah"/></marker><marker id="honor_datapipe-ahacc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z" class="ah k-acc"/></marker><marker id="honor_datapipe-ahblue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z" class="ah k-blue"/></marker><marker id="honor_datapipe-ahmut" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z" class="ah k-mut"/></marker></defs>
<rect x="0.0" y="40.0" width="150.0" height="78.0" rx="5" class="box"/>
<text x="75.0" y="69.2" class="t" text-anchor="middle">Robot recording</text>
<text x="75.0" y="83.6" class="m" text-anchor="middle">every episode,</text>
<text x="75.0" y="97.6" class="m" text-anchor="middle">failures included</text>
<rect x="180.0" y="40.0" width="160.0" height="78.0" rx="5" class="box"/>
<text x="260.0" y="69.2" class="t" text-anchor="middle">Local persistence</text>
<text x="260.0" y="83.6" class="m" text-anchor="middle">LeRobot v2.1</text>
<text x="260.0" y="97.6" class="m" text-anchor="middle">parquet + mp4 + meta</text>
<rect x="370.0" y="40.0" width="160.0" height="78.0" rx="5" class="box"/>
<text x="450.0" y="69.2" class="t" text-anchor="middle">Episode verdict</text>
<text x="450.0" y="83.6" class="m" text-anchor="middle">success classifier</text>
<text x="450.0" y="97.6" class="m" text-anchor="middle">operator may only veto ↓</text>
<path d="M153.0,79.0 L177.0,79.0" class="ln" marker-end="url(#honor_datapipe-ah)"/>
<path d="M343.0,79.0 L367.0,79.0" class="ln" marker-end="url(#honor_datapipe-ah)"/>
<text x="690.0" y="12.0" class="cap" text-anchor="middle">LEARNER</text>
<rect x="600.0" y="20.0" width="180.0" height="48.0" rx="5" class="box k-acc"/>
<text x="690.0" y="41.2" class="t" text-anchor="middle">Success bucket</text>
<text x="690.0" y="55.6" class="m" text-anchor="middle">→ training buffer</text>
<rect x="600.0" y="92.0" width="180.0" height="48.0" rx="5" class="box k-mut"/>
<text x="690.0" y="113.2" class="t" text-anchor="middle">Failure bucket</text>
<text x="690.0" y="127.6" class="m" text-anchor="middle">→ reward-model data</text>
<line x1="533.0" y1="79.0" x2="556.0" y2="79.0" class="ln"/>
<path d="M556.0,79.0 L556.0,44.0 L597.0,44.0" class="ln k-acc" marker-end="url(#honor_datapipe-ahacc)"/>
<path d="M556.0,79.0 L556.0,116.0 L597.0,116.0" class="ln k-mut" marker-end="url(#honor_datapipe-ahmut)"/>
<text x="544.0" y="73.0" class="m" text-anchor="middle">ZMQ</text>
<text x="0.0" y="174.0" class="cap">ONE ROUND OF REAL-ROBOT DATA · 83 EPISODES · 19,075 FRAMES</text>
<rect x="0.0" y="184.0" width="700.9" height="22.0" rx="2" class="f-blue"/>
<rect x="702.9" y="184.0" width="77.1" height="22.0" rx="2" class="f-acc"/>
<text x="0.0" y="228.0" class="t blue">teleoperated takeover · 17,141 frames (89.9%)</text>
<text x="780.0" y="228.0" class="t acc" text-anchor="end">autonomous · 1,934 (10.1%)</text>
<text x="0.0" y="244.0" class="m">≈ 90% of the frames are a human correcting the policy — exactly where the model is weak</text>
</svg>
