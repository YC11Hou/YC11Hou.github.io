<svg class="fig-svg" viewBox="0 0 780 384" role="img" aria-label="From a YOLOv11 segmentation mask and a depth image to a casualty position on the map" xmlns="http://www.w3.org/2000/svg">
<defs><marker id="vehicle_localize-ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z" class="ah"/></marker><marker id="vehicle_localize-ahacc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z" class="ah k-acc"/></marker><marker id="vehicle_localize-ahblue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z" class="ah k-blue"/></marker><marker id="vehicle_localize-ahmut" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z" class="ah k-mut"/></marker></defs>
<text x="0.0" y="12.0" class="cap">PER CAMERA FRAME</text>
<rect x="0.5" y="24.0" width="143.0" height="78.0" rx="5" class="box"/>
<text x="72.0" y="53.2" class="t" text-anchor="middle">① Segment</text>
<text x="72.0" y="67.6" class="m" text-anchor="middle">YOLOv11-seg on RGB</text>
<text x="72.0" y="81.6" class="m" text-anchor="middle">→ person mask</text>
<path d="M146.5,63.0 L156.5,63.0" class="ln" marker-end="url(#vehicle_localize-ah)"/>
<rect x="159.5" y="24.0" width="143.0" height="78.0" rx="5" class="box"/>
<text x="231.0" y="53.2" class="t" text-anchor="middle">② Range</text>
<text x="231.0" y="67.6" class="m" text-anchor="middle">mask on depth image</text>
<text x="231.0" y="81.6" class="m" text-anchor="middle">median filter → d_tar</text>
<path d="M305.5,63.0 L315.5,63.0" class="ln" marker-end="url(#vehicle_localize-ah)"/>
<rect x="318.5" y="24.0" width="143.0" height="78.0" rx="5" class="box"/>
<text x="390.0" y="53.2" class="t" text-anchor="middle">③ Bearing</text>
<text x="390.0" y="67.6" class="m" text-anchor="middle">mask centre x_cen</text>
<text x="390.0" y="81.6" class="m" text-anchor="middle">→ θ_off via FOV</text>
<path d="M464.5,63.0 L474.5,63.0" class="ln" marker-end="url(#vehicle_localize-ah)"/>
<rect x="477.5" y="24.0" width="143.0" height="78.0" rx="5" class="box"/>
<text x="549.0" y="53.2" class="t" text-anchor="middle">④ Camera frame</text>
<text x="549.0" y="67.6" class="m" text-anchor="middle">x_c = d_tar sin θ_off</text>
<text x="549.0" y="81.6" class="m" text-anchor="middle">y_c = d_tar cos θ_off</text>
<path d="M623.5,63.0 L633.5,63.0" class="ln" marker-end="url(#vehicle_localize-ah)"/>
<rect x="636.5" y="24.0" width="143.0" height="78.0" rx="5" class="box k-acc"/>
<text x="708.0" y="53.2" class="t" text-anchor="middle">⑤ Map frame</text>
<text x="708.0" y="67.6" class="m" text-anchor="middle">+ robot pose</text>
<text x="708.0" y="81.6" class="m" text-anchor="middle">→ casualty list</text>
<text x="0.0" y="140.0" class="cap">IMAGE PLANE</text>
<rect x="0.5" y="150.0" width="299.0" height="170.0" rx="4" class="box"/>
<rect x="196.0" y="192.0" width="40.0" height="116.0" rx="14" class="box k-acc"/>
<text x="216.0" y="254.0" class="serif" text-anchor="middle">d_tar</text>
<line x1="216.0" y1="150.0" x2="216.0" y2="232.0" class="ln k-acc dash"/>
<line x1="216.0" y1="266.0" x2="216.0" y2="320.0" class="ln k-acc dash"/>
<path d="M0.5,340.0 L216.0,340.0" class="ln k-acc" marker-start="url(#vehicle_localize-ahacc)" marker-end="url(#vehicle_localize-ahacc)"/>
<text x="108.0" y="334.0" class="serif" text-anchor="middle">x_cen</text>
<path d="M0.5,366.0 L299.5,366.0" class="ln" marker-start="url(#vehicle_localize-ah)" marker-end="url(#vehicle_localize-ah)"/>
<text x="150.0" y="360.0" class="serif" text-anchor="middle">W_img</text>
<text x="400.0" y="140.0" class="cap">TOP VIEW · CAMERA FRAME</text>
<path d="M520.0,352.0 L520.0,152.0" class="ln k-mut" marker-end="url(#vehicle_localize-ahmut)"/>
<path d="M520.0,352.0 L772.0,352.0" class="ln k-mut" marker-end="url(#vehicle_localize-ahmut)"/>
<text x="528.0" y="160.0" class="m">y (forward)</text>
<text x="772.0" y="368.0" class="m" text-anchor="end">x</text>
<line x1="520.0" y1="352.0" x2="371.5" y2="203.5" class="ln k-mut dash"/>
<line x1="520.0" y1="352.0" x2="668.5" y2="203.5" class="ln k-mut dash"/>
<text x="674.5" y="207.5" class="m">camera FOV</text>
<line x1="594.5" y1="199.2" x2="594.5" y2="352.0" class="ln k-mut dash"/>
<line x1="594.5" y1="199.2" x2="520.0" y2="199.2" class="ln k-mut dash"/>
<path d="M520,352 L594.5,199.2" class="ln k-acc" style="stroke-width:1.6"/>
<text x="575.3" y="226.1" class="serif acc" text-anchor="end">d_tar</text>
<path d="M520,272 A80,80 0 0 1 555.1,280.1" class="ln k-acc"/>
<text x="543.4" y="254.7" class="serif" text-anchor="middle">θ_off</text>
<text x="594.5" y="368.0" class="serif" text-anchor="middle">x_c</text>
<text x="512.0" y="203.2" class="serif" text-anchor="end">y_c</text>
<circle cx="520" cy="352" r="5.5" class="f-blue"/>
<text x="510.0" y="356.0" class="s" text-anchor="end">robot</text>
<circle cx="594.5" cy="199.2" r="5.5" class="f-acc"/>
<text x="584.5" y="191.2" class="s acc" text-anchor="end">casualty</text>
</svg>
